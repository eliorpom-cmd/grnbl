<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>grnbl · rédaction</title>
<style>
  :root {
    --bg: #fbfbfd; --panel: #ffffff; --hover: #f2f2f5; --sel: #e8f0fe;
    --ink: #1d1d1f; --body: #515154; --mute: #86868b; --line: rgba(0, 0, 0, .08);
    --accent: #0071e3; --keep: #1a7f37; --drop: #c4314b; --warn: #b25e09;
    --wa-bg: #efeae2; --wa-bubble: #ffffff; --wa-ink: #111b21; --wa-meta: #667781;
    --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 8px 24px rgba(0, 0, 0, .06);
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0b0d; --panel: #141416; --hover: #1c1c1f; --sel: #10243f;
      --warn: #fbbf24;
      --ink: #f5f5f7; --body: #b4b4b9; --mute: #7c7c82; --line: rgba(255, 255, 255, .08);
      --accent: #3b93ff; --keep: #3fb950; --drop: #ff6b81; --warn: #f0a04b;
      --wa-bg: #0b141a; --wa-bubble: #202c33; --wa-ink: #e9edef; --wa-meta: #8696a0;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }
  kbd { font: 11px/1 -apple-system, sans-serif; color: var(--mute); border: 1px solid var(--line); border-radius: 4px; padding: 2px 5px; background: var(--panel); }

  /* Top bar */
  .top { height: 52px; flex: none; display: flex; align-items: center; gap: 16px; padding: 0 16px; border-bottom: 1px solid var(--line); }
  .brand { font-weight: 650; letter-spacing: -.02em; font-size: 16px; }
  .day { color: var(--mute); }
  .seg { display: flex; background: var(--hover); border-radius: 8px; padding: 2px; margin-left: 8px; }
  .seg button { border: 0; background: none; padding: 4px 14px; border-radius: 6px; color: var(--body); transition: background .18s var(--ease), color .18s var(--ease); }
  .pcheck { margin-top: 4px; font-size: 13px; color: var(--warn, #b45309); }
  .seg.chans { overflow-x: auto; max-width: 100%; scrollbar-width: none; }
  .seg.chans button { white-space: nowrap; }
  .seg button.on { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .search { margin-left: auto; width: 240px; height: 30px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 0 10px; outline: none; transition: border-color .18s var(--ease); }
  .search:focus { border-color: var(--accent); }

  /* Triage: queues | list | inspector */
  .triage { flex: 1; min-height: 0; display: grid; grid-template-columns: 216px minmax(320px, 1fr) minmax(380px, 460px); }
  .queues { border-right: 1px solid var(--line); padding: 12px 8px; overflow: auto; }
  .group { color: var(--mute); font-size: 12px; font-weight: 600; padding: 14px 10px 4px; }
  .q { width: 100%; display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 6px 10px; border-radius: 7px; text-align: left; color: var(--body); transition: background .15s var(--ease); }
  .q:hover { background: var(--hover); }
  .q.on { background: var(--hover); color: var(--ink); font-weight: 600; }
  .q .n { margin-left: auto; color: var(--mute); font-variant-numeric: tabular-nums; font-weight: 400; }
  .q .ic { width: 8px; height: 8px; border-radius: 50%; flex: none; margin: 0 4px; background: var(--mute); opacity: .5; }
  .q .ic.keep { background: var(--keep); opacity: 1; } .q .ic.drop { background: var(--drop); opacity: 1; }
  .q .ic.warn { background: var(--warn); opacity: 1; } .q .ic.accent { background: var(--accent); opacity: 1; }

  .list { overflow: auto; border-right: 1px solid var(--line); }
  .list-head { position: sticky; top: 0; z-index: 1; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); padding: 12px 16px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 8px; }
  .list-head h2 { margin: 0; font-size: 15px; font-weight: 650; }
  .list-head span { color: var(--mute); }
  .row { display: grid; grid-template-columns: 8px 1fr auto; gap: 10px; align-items: start; padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .15s var(--ease); }
  .row:hover { background: var(--hover); }
  .row.sel { background: var(--sel); }
  .row .st { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; background: var(--line); }
  .row .st.keep { background: var(--keep); } .row .st.drop { background: var(--drop); }
  .row .t { font-weight: 550; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .m { color: var(--mute); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .side { text-align: right; font-size: 12px; color: var(--mute); white-space: nowrap; }
  .score { letter-spacing: 1.5px; color: var(--accent); font-size: 10px; }
  .badges { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
  .b { font-size: 11px; line-height: 18px; padding: 0 7px; border-radius: 99px; background: var(--hover); color: var(--body); white-space: nowrap; }
  .b.pick { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
  .b.book { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
  .b.free { background: color-mix(in srgb, var(--keep) 14%, transparent); color: var(--keep); }
  .empty { color: var(--mute); text-align: center; padding: 64px 24px; }

  /* Inspector */
  .insp { overflow: auto; padding: 24px 24px 32px; }
  .insp h1 { margin: 0 0 4px; font-size: 22px; line-height: 1.2; letter-spacing: -.02em; font-weight: 650; }
  .insp .sub { color: var(--body); margin-bottom: 18px; }
  .facts { display: grid; grid-template-columns: 96px 1fr; gap: 6px 12px; margin: 0 0 20px; }
  .facts dt { color: var(--mute); }
  .facts dd { margin: 0; color: var(--ink); overflow-wrap: anywhere; }
  .note { border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; background: var(--hover); color: var(--body); }
  .note b { color: var(--ink); font-weight: 600; }
  .note.pick { background: color-mix(in srgb, var(--accent) 9%, transparent); }
  .note.dropped { background: color-mix(in srgb, var(--drop) 9%, transparent); }
  .label { font-size: 12px; font-weight: 600; color: var(--mute); margin: 20px 0 6px; display: flex; justify-content: space-between; }
  textarea { width: 100%; min-height: 76px; resize: vertical; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 10px 12px; outline: none; line-height: 1.45; transition: border-color .18s var(--ease); }
  textarea:focus { border-color: var(--accent); }
  .actions { display: flex; gap: 8px; margin-top: 14px; align-items: center; }
  .btn { height: 36px; border-radius: 99px; padding: 0 16px; border: 1px solid var(--line); background: var(--panel); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; transition: transform .15s var(--ease), background .15s var(--ease); }
  .btn:active { transform: scale(.97); }
  .btn.keep { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn.keep.on { background: var(--keep); border-color: var(--keep); color: #fff; }
  .btn.drop.on { background: var(--drop); border-color: var(--drop); color: #fff; }
  .btn kbd { border-color: currentColor; color: inherit; opacity: .6; background: none; }
  .undo { margin-left: auto; color: var(--mute); font-size: 13px; background: none; border: 0; }
  .hint { color: var(--mute); font-size: 12px; margin-top: 24px; display: flex; gap: 14px; flex-wrap: wrap; }

  /* Posts: editor's notes | WhatsApp preview */
  .posts { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(320px, 1fr) minmax(380px, 520px); }
  .notes { overflow: auto; padding: 24px; border-right: 1px solid var(--line); }
  .chans { display: inline-flex; margin: 0 0 24px; }
  .notes h2 { font-size: 15px; font-weight: 650; margin: 0 0 4px; }
  .notes .lead { color: var(--body); margin: 0 0 16px; }
  .pick-row { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .pick-row:hover .pt { color: var(--accent); }
  .pick-row .num { color: var(--mute); font-variant-numeric: tabular-nums; }
  .pick-row .pt { font-weight: 550; transition: color .15s var(--ease); }
  .pick-row .pw { color: var(--body); font-size: 13px; }
  .notes section + section { margin-top: 28px; }
  .summary { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 16px; border-radius: 12px; background: var(--hover); margin: 0 0 24px; }
  .summary span { color: var(--body); }
  .summary .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .btn.send { background: var(--keep); border-color: var(--keep); color: #fff; }
  .btn:disabled { opacity: .55; cursor: default; }
  .summary .sent { color: var(--keep); font-weight: 600; white-space: nowrap; }
  .prow { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); transition: opacity .18s var(--ease); }
  .prow.off { opacity: .5; } .prow.dropped .pline { text-decoration: line-through; }
  .pt { font-weight: 600; }
  .pline { color: var(--ink); margin-top: 2px; }
  .pw { color: var(--mute); font-size: 12.5px; margin-top: 2px; }
  .pact { display: flex; gap: 6px; align-items: start; }
  .mini { height: 28px; min-width: 28px; padding: 0 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); color: var(--body); font-size: 12.5px; transition: background .15s var(--ease), color .15s var(--ease); }
  @media (hover: hover) { .mini:hover { background: var(--ink); color: var(--bg); } }
  .sec-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; margin: 0 0 4px; }
  .sec-head h2 { margin: 0; white-space: nowrap; }
  .sec-head span { color: var(--mute); white-space: nowrap; }
  .link { margin-left: auto; white-space: nowrap; border: 0; background: none; color: var(--accent); padding: 4px 0; font-size: 13px; }
  .cand { display: grid; grid-template-columns: 22px 1fr auto; gap: 12px; align-items: start; padding: 12px 8px; margin: 0 -8px; border-top: 1px solid var(--line); border-radius: 10px; cursor: pointer; transition: background .15s var(--ease), opacity .15s var(--ease); }
  .cand:not(.on) { opacity: .8; }
  .cand.on { background: color-mix(in srgb, var(--keep) 6%, transparent); }
  @media (hover: hover) { .cand:hover { background: var(--hover); } }
  .cand:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .box { width: 22px; height: 22px; margin-top: 1px; border-radius: 6px; border: 1.5px solid var(--mute); display: grid; place-items: center; transition: background .15s var(--ease), border-color .15s var(--ease); }
  .cand.on .box { background: var(--keep); border-color: var(--keep); }
  .cand.on .box::after { content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
  .am { color: var(--mute); font-size: 12.5px; }
  .clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--body); }
  .star { color: var(--warn); margin-right: 6px; }
  .more { width: 100%; margin: 4px 0 0; padding: 12px; border: 1px dashed var(--line); border-radius: 10px; background: none; color: var(--accent); font-weight: 600; }
  .bench { color: var(--mute); font-size: 12px; font-weight: 600; padding: 14px 0 4px; }
  .phone { overflow: auto; background: var(--wa-bg); padding: 20px 18px 40px; }
  .chan { display: flex; align-items: center; gap: 10px; margin: -20px -18px 16px; padding: 12px 18px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: -20px; z-index: 1; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--hover); display: grid; place-items: center; font-size: 18px; }
  .chan small { display: block; color: var(--mute); }
  .bubble { position: relative; background: var(--wa-bubble); color: var(--wa-ink); border-radius: 8px; padding: 8px 10px 20px; margin: 0 0 14px; max-width: 100%; box-shadow: 0 1px .5px rgba(11, 20, 26, .13); white-space: pre-wrap; overflow-wrap: anywhere; font: 14.2px/1.42 -apple-system, "Helvetica Neue", sans-serif; }
  .bubble .time { position: absolute; right: 10px; bottom: 4px; font-size: 11px; color: var(--wa-meta); }
  .bubble .copy { position: absolute; right: 6px; top: 6px; border: 0; border-radius: 6px; background: var(--hover); color: var(--body); font-size: 12px; padding: 2px 8px; opacity: 0; transition: opacity .15s var(--ease); }
  .bubble:hover .copy { opacity: 1; }
  .bubble a { color: #027eb5; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 12px); opacity: 0; background: var(--ink); color: var(--bg); border-radius: 99px; padding: 8px 16px; font-weight: 500; transition: opacity .2s var(--ease), transform .2s var(--ease); pointer-events: none; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 1100px) { .triage { grid-template-columns: 180px 1fr 380px; } }
  .back, .panes { display: none; }
  .btn { white-space: nowrap; }

  /* Phone: one page that scrolls, the action under the thumb, one thing at a time. */
  @media (max-width: 820px) {
    html, body { height: auto; }
    body { font-size: 15px; }
    kbd, .hint, .day, .undo kbd { display: none; }
    .top { position: sticky; top: 0; z-index: 5; height: auto; min-height: 52px; flex-wrap: wrap; gap: 8px 10px; padding: 8px 16px;
      padding-top: max(8px, env(safe-area-inset-top)); background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(12px); }
    .top .seg { margin-left: auto; }
    .seg button { min-height: 36px; padding: 0 16px; }
    .search { display: none; order: 3; width: 100%; height: 40px; margin: 0; font-size: 16px; }
    body.v-triage .search { display: block; }

    /* Publier */
    .posts { display: block; }
    .notes { overflow: visible; border: 0; padding: 16px 16px 0; }
    .chans { display: flex; width: 100%; margin: 0 0 12px; }
    .chans button, .panes button { flex: 1; }
    .panes { display: flex; width: 100%; margin: 0 0 16px; }
    .posts.pane-preview .notes section, .posts:not(.pane-preview) .phone { display: none; }
    .phone { overflow: visible; min-height: 60vh; padding: 16px 16px 140px; }
    .chan { position: static; margin: -16px -16px 16px; padding: 12px 16px; }
    .bubble .copy { opacity: 1; }
    .summary { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; margin: 0; border-radius: 16px 16px 0 0;
      flex-direction: column; align-items: stretch; gap: 10px; padding: 14px 16px; padding-bottom: max(14px, env(safe-area-inset-bottom));
      background: var(--panel); box-shadow: 0 -1px 0 var(--line), 0 -8px 24px rgba(0, 0, 0, .08); }
    .summary br, .summary > div > span { display: none; }
    .summary .acts { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
    .summary .btn, .summary .sent { height: 48px; justify-content: center; font-size: 16px; }
    .summary .sent { display: flex; align-items: center; }
    .notes section:last-child { padding-bottom: 150px; }
    .cand { padding: 14px 8px; }
    .box { width: 26px; height: 26px; }
    .cand { grid-template-columns: 26px 1fr auto; }
    .mini { height: 40px; min-width: 40px; font-size: 14px; padding: 0 14px; }

    /* Fouiller: the list, then the event on its own screen */
    .triage { display: block; }
    .queues { position: sticky; top: var(--top, 104px); z-index: 4; display: flex; overflow-x: auto; gap: 6px; border: 0; border-bottom: 1px solid var(--line);
      padding: 8px 16px; background: var(--bg); scrollbar-width: none; }
    .queues::-webkit-scrollbar { display: none; }
    .group { display: none; }
    .q { width: auto; white-space: nowrap; min-height: 36px; border-radius: 99px; border: 1px solid var(--line); padding: 0 12px; }
    .list { overflow: visible; border: 0; }
    .list-head { position: static; padding: 14px 16px 8px; }
    .row { padding: 14px 16px; }
    .row .t { white-space: normal; }
    .row .side { display: none; }
    .insp { display: none; }
    .triage.detail .insp { display: block; position: fixed; inset: 0; z-index: 10; overflow: auto; background: var(--bg); padding: 0 16px 120px; }
    .back { display: flex; align-items: center; position: sticky; top: 0; z-index: 1; margin: 0 -16px 12px; padding: 10px 16px;
      padding-top: max(10px, env(safe-area-inset-top)); border: 0; width: calc(100% + 32px); background: color-mix(in srgb, var(--bg) 90%, transparent);
      backdrop-filter: blur(12px); color: var(--accent); font-size: 16px; font-weight: 600; text-align: left; }
    .insp h1 { font-size: 24px; }
    .facts { grid-template-columns: 92px 1fr; }
    textarea { font-size: 16px; }
    .actions { position: fixed; left: 0; right: 0; bottom: 0; margin: 0; padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom));
      background: var(--panel); box-shadow: 0 -1px 0 var(--line); display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .actions .btn { height: 48px; justify-content: center; font-size: 16px; }
    .actions .undo { grid-column: 1 / -1; margin: 0; padding: 4px; }
    .toast { bottom: calc(110px + env(safe-area-inset-bottom)); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <span class="brand">grnbl</span>
  <span class="day" id="day"></span>
  <div class="seg" id="views">
    <button data-v="posts" class="on">Publier <kbd>1</kbd></button>
    <button data-v="triage">Fouiller <kbd>2</kbd></button>
  </div>
  <input class="search" id="search" placeholder="Rechercher  /" autocomplete="off">
</header>

<div class="triage" id="triage" hidden>
  <nav class="queues" id="queues"></nav>
  <div class="list" id="list"></div>
  <aside class="insp" id="insp"></aside>
</div>

<div class="posts" id="posts">
  <div class="notes" id="notes"></div>
  <div class="phone" id="phone"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const QUEUES = [
  ["Rédaction", [
    ["picks", "Sélection du jour", "accent"],
    ["todo", "Tout ce que l'IA garde", "dot"],
    ["kept", "Gardés", "keep"],
    ["dropped", "Écartés", "drop"],
    ["dupes", "Doublons", "dot"],
  ]],
  ["Moment", [
    ["book", "À réserver", "warn"],
    ["week", "Cette semaine", "accent"],
    ["late", "Hors délai", "dot"],
  ]],
  ["Filtres", [
    ["free", "Gratuit", "keep"],
    ["family", "Famille", "dot"],
    ["rare", "Rare", "dot"],
  ]],
];
const TIMING = { book_now: "à réserver", opens_soon: "résa bientôt", this_week: "cette semaine", too_late: "trop tard", sold_out: "complet", later: "plus tard" };
let pane = "lines", from = null;
const phone = () => matchMedia("(max-width: 820px)").matches;
const AVATARS = { gratuit: "🆓", sorties: "🎭", famille: "👨‍👩‍👧", bonsplans: "🛍️", nature: "🏔️", infos: "🚨", carburant: "⛽" };
let events = [], view = "posts", queue = "picks", selected = null, query = "", channel = "gratuit", postsData = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const toast = (t) => { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove("on"), 1600); };

function status(e) {
  if (e.decision?.status) return e.decision.status;
  if (e.review?.duplicate_of != null) return "dupe";
  return e.review?.keep ? "ai-keep" : "ai-drop";
}
function inQueue(e, q) {
  const s = status(e), t = e.timing;
  switch (q) {
    case "picks": return !!e.pick;
    case "todo": return s === "ai-keep";
    case "kept": return s === "keep";
    case "dropped": return s === "drop" || (s === "ai-drop" && !e.review?.auto);
    case "dupes": return s === "dupe";
    case "book": return (t === "book_now" || t === "opens_soon") && s !== "drop" && s !== "ai-drop";
    case "week": return t === "this_week" && s !== "drop" && s !== "ai-drop";
    case "late": return t === "too_late" || t === "later" || t === "sold_out";
    case "free": return (e.review?.free ?? e.free) === true && s !== "ai-drop" && s !== "drop";
    case "family": return (e.review?.family ?? e.family) && s !== "ai-drop" && s !== "drop";
    case "rare": return e.review?.rare && s !== "ai-drop" && s !== "drop";
  }
  return false;
}
function matches(e) {
  if (!query) return true;
  const hay = `${e.title} ${e.venue || ""} ${e.town || ""} ${e.source_name || ""}`.toLowerCase();
  return hay.includes(query);
}
function rows() {
  return events.filter((e) => inQueue(e, queue) && matches(e)).sort((a, b) =>
    (a.pick ? 0 : 1) - (b.pick ? 0 : 1) || (a.pick?.rank ?? 0) - (b.pick?.rank ?? 0) ||
    (b.review?.score ?? 0) - (a.review?.score ?? 0) || String(a.start).localeCompare(String(b.start)));
}
function when(raw, short) {
  if (!raw) return "";
  const s = String(raw), d = new Date(s.length > 10 ? s : s + "T00:00");
  const day = d.toLocaleDateString("fr-FR", short ? { weekday: "short", day: "numeric", month: "short" } : { weekday: "long", day: "numeric", month: "long" });
  return s.length > 10 ? `${day} · ${d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}` : day;
}
function span(e, short) {
  return e.end && String(e.end).slice(0, 10) !== String(e.start).slice(0, 10) ? `${when(e.start, true)} → ${when(e.end, true)}` : when(e.start, short);
}
const place = (e) => { const p = e.venue || e.town || ""; return p === p.toUpperCase() && p.length > 6 ? p.toLowerCase().replace(/(^|[\s-])\S/g, (c) => c.toUpperCase()) : p; };
const free = (e) => (e.review?.free ?? e.free) === true;

function renderQueues() {
  $("queues").innerHTML = QUEUES.map(([g, qs]) => `<div class="group">${g}</div>` + qs.map(([k, label, ic]) => {
    const n = events.filter((e) => inQueue(e, k) && matches(e)).length;
    return `<button class="q ${k === queue ? "on" : ""}" data-q="${k}"><span class="ic ${ic}"></span>${label}<span class="n">${n}</span></button>`;
  }).join("")).join("");
}

function renderList() {
  const rs = rows();
  if (!rs.some((e) => e.i === selected)) selected = rs[0]?.i ?? null;
  const name = QUEUES.flatMap((g) => g[1]).find((q) => q[0] === queue)[1];
  $("list").innerHTML = `<div class="list-head"><h2>${name}</h2><span>${rs.length}</span></div>` + (rs.map((e) => {
    const s = status(e), r = e.review || {};
    const dot = s === "keep" ? "keep" : s === "drop" ? "drop" : "";
    const badges = [
      e.pick ? `<span class="b pick">Sélection</span>` : "",
      e.timing === "book_now" || e.timing === "opens_soon" ? `<span class="b book">${TIMING[e.timing]}</span>` : "",
      free(e) ? `<span class="b free">gratuit</span>` : "",
      r.rare ? `<span class="b">rare</span>` : "",
      (r.family ?? e.family) ? `<span class="b">famille</span>` : "",
    ].join("");
    return `<div class="row ${e.i === selected ? "sel" : ""}" data-i="${e.i}">
      <span class="st ${dot}"></span>
      <div style="min-width:0"><div class="t">${esc(e.title)}</div><div class="m">${esc(span(e, true))}${place(e) ? " · " + esc(place(e)) : ""}</div>${badges ? `<div class="badges">${badges}</div>` : ""}</div>
      <div class="side"><div class="score">${"●".repeat(r.score || 0)}${"○".repeat(r.score ? 5 - r.score : 0)}</div>${esc(e.source_name || "")}${e.also ? ` +${e.also.length}` : ""}</div>
    </div>`;
  }).join("") || `<p class="empty">Rien ici. Change de file ou efface la recherche.</p>`);
}

function renderInspector() {
  const e = events.find((x) => x.i === selected);
  if (!e) { $("insp").innerHTML = `<button class="back" data-back>‹ Liste</button><p class="empty">Sélectionne un événement.</p>`; return; }
  const r = e.review || {}, s = status(e), d = e.decision;
  const booking = e.booking === "required" ? "Obligatoire" : e.booking === "recommended" ? "Conseillée" : e.booking === "none" ? "Non" : "Inconnue";
  const facts = [
    ["Quand", span(e)],
    ["Où", [e.venue, e.town].filter(Boolean).join(", ")],
    ["Prix", e.price || (free(e) ? "Gratuit" : "")],
    ["Réservation", booking + (e.booking_opens ? ` · ouvre ${when(e.booking_opens)}` : "") + (e.booking_deadline ? ` · avant ${when(e.booking_deadline)}` : "")],
    ["Moment", TIMING[e.timing] || ""],
    ["Source", `${esc(e.source_name || "")}${e.also ? ` et ${e.also.length} autre${e.also.length > 1 ? "s" : ""}` : ""}`],
  ].filter(([, v]) => v);
  const link = e.booking_url || e.url;
  const line = d?.line || e.pick?.line || r.line || "";
  $("insp").innerHTML = `
    <button class="back" data-back>‹ ${from === "posts" ? "Publier" : "Liste"}</button>
    <h1>${esc(e.title)}</h1>
    <div class="sub">${esc(e.description || "")}</div>
    <dl class="facts">${facts.map(([k, v]) => `<dt>${k}</dt><dd>${k === "Source" ? v : esc(v)}</dd>`).join("")}
      ${link ? `<dt>Lien</dt><dd><a href="${esc(link)}" target="_blank" rel="noopener">${esc(new URL(link).hostname.replace("www.", ""))} ↗</a></dd>` : ""}</dl>
    ${e.pick ? `<div class="note pick"><b>Rédacteur en chef :</b> ${esc(e.pick.why)}${e.pick.zoom ? `<br><b>Temps fort :</b> ${esc(e.pick.zoom.what)}, ${esc(when(e.pick.zoom.when))}` : ""}</div>` : ""}
    ${r.keep === false && r.why ? `<div class="note dropped"><b>${r.auto ? "Règle" : "IA"} :</b> ${esc(r.why)}</div>` : ""}
    ${s === "dupe" ? `<div class="note">Doublon de « ${esc(events.find((x) => x.i === r.duplicate_of)?.title || "#" + r.duplicate_of)} »</div>` : ""}
    <div class="label"><span>Ligne du post</span><span><kbd>E</kbd> modifier</span></div>
    <textarea id="line">${esc(line)}</textarea>
    <div class="actions">
      <button class="btn keep ${s === "keep" ? "on" : ""}" data-a="keep">Garder <kbd>G</kbd></button>
      <button class="btn drop ${s === "drop" ? "on" : ""}" data-a="drop">Écarter <kbd>X</kbd></button>
      ${d ? `<button class="undo" data-a="undo">Annuler ma décision <kbd>U</kbd></button>` : ""}
    </div>
    <div class="hint"><span><kbd>J</kbd> <kbd>K</kbd> naviguer</span><span><kbd>G</kbd> garder</span><span><kbd>X</kbd> écarter</span><span><kbd>/</kbd> chercher</span><span><kbd>1</kbd> publier</span></div>`;
}

function render() {
  if (view === "triage") { renderQueues(); renderList(); renderInspector(); }
  else renderPosts();
}

function openDetail(on) {
  $("triage").classList.toggle("detail", on && phone());
  document.body.style.overflow = on && phone() ? "hidden" : "";
  if (on) $("insp").scrollTop = 0;
}
function select(i, scroll) {
  selected = i; renderList(); renderInspector(); openDetail(true);
  if (scroll) document.querySelector(`.row[data-i="${i}"]`)?.scrollIntoView({ block: "nearest" });
}
function move(step) {
  const rs = rows(), k = rs.findIndex((e) => e.i === selected);
  const next = rs[Math.max(0, Math.min(rs.length - 1, k + step))];
  if (next) select(next.i, true);
}

async function save(e, decision) {
  await fetch("/api/decide", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ i: e.i, decision }) });
  e.decision = decision;
  postsData = null;
}

async function decide(status) {
  const e = events.find((x) => x.i === selected);
  if (!e) return;
  const rs = rows(), k = rs.findIndex((x) => x.i === e.i);
  const decision = status ? { status, line: ($("line")?.value || "").trim() } : null;
  await save(e, decision);
  toast(status === "keep" ? "Gardé" : status === "drop" ? "Écarté" : "Décision annulée");
  // Move on to the next one still in the queue, like an inbox.
  const after = rows();
  if (status && !after.some((x) => x.i === e.i)) selected = (after[k] || after[k - 1] || {}).i ?? null;
  else if (status) { const n = rs[k + 1]; if (n) selected = n.i; }
  render();
  document.querySelector(`.row[data-i="${selected}"]`)?.scrollIntoView({ block: "nearest" });
}

// WhatsApp formatting: *bold*, _italic_, links.
function wa(text) {
  return esc(text)
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<b>$2</b>")
    .replace(/(^|[\s(])_([^_\n]+)_/g, "$1<i>$2</i>");
}

// One ticked list per post: the editor's lines come ticked, the human ticks or unticks freely.
const ticked = (c) => ["to_book", "week"].flatMap((post) => (c.lists?.[post] || []).filter((x) => x.on));
const opened = new Set();  // posts whose other candidates are shown

// The WhatsApp step: offered once the post is approved, then shows what the outbox says.
function sendButton(c, ready) {
  const out = Object.values(c.outbox || {}), sent = out.filter((r) => r.status === "sent"), failed = out.find((r) => r.status === "failed");
  if (out.length && sent.length === out.length) return `<span class="sent">Envoyé à ${esc(sent[0].sent_at.slice(11, 16))} ✓</span>`;
  const when = c.sends_at ? new Date(c.sends_at).toLocaleString("fr-FR", { weekday: "long", hour: "numeric", minute: "2-digit" }).replace(":00", " h") : "";
  if (!ready) return when ? `<span class="sent">Part ${esc(when)} si validé</span>` : "";
  if (when && new Date(c.sends_at) > new Date()) return `<span class="sent">Validé · part ${esc(when)} ✓</span>`;
  if (!c.linked) return `<button class="btn" disabled title="Relie le groupe : node whatsapp/send.mjs groups, puis data/whatsapp.json">Groupe pas encore relié</button>`;
  return `<button class="btn send" data-act="publish" ${failed ? `title="${esc(failed.error || "")}"` : ""}>${failed ? "Réessayer l'envoi" : "Publier sur WhatsApp"}</button>`;
}

async function renderPosts() {
  if (!postsData) {
    if (!$("phone").innerHTML) $("phone").innerHTML = `<p class="empty">Préparation des posts…</p>`;
    postsData = await (await fetch("/api/posts")).json();
  }
  const chans = postsData.channels, c = chans.find((x) => x.id === channel) || chans[0];
  const shown = ticked(c);
  const okAll = shown.length && shown.every((x) => x.status === "keep");
  const short = (raw) => raw ? new Date(String(raw).length > 10 ? raw : raw + "T00:00").toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" }) : "";
  const row = (x) => `<div class="cand ${x.on ? "on" : ""}" data-i="${x.i}" data-post="${x.post}" role="checkbox" aria-checked="${x.on}" tabindex="0">
      <span class="box" aria-hidden="true"></span>
      <div class="pmain"><div class="pt">${x.editor && !x.main && !x.on ? `<span class="star" title="Remplaçant proposé par l'IA">★</span>` : ""}${esc(x.title)}${x.status === "keep" && x.on ? ` <span class="b free">validé</span>` : ""}</div>
        <div class="am">${esc([short(x.start), x.place, x.free ? "gratuit" : ""].filter(Boolean).join(" · "))}</div>
        <div class="pline ${x.on ? "" : "clamp"}">${esc(x.line || "")}</div>${x.check && x.check.length ? `<div class="pcheck">⚠️ À vérifier sur la page : ${esc(x.check.join(", "))}</div>` : ""}${x.on && x.why ? `<div class="pw">${esc(x.why)}</div>` : ""}</div>
      <button class="mini" data-act="open" title="Ouvrir la fiche">Fiche</button></div>`;
  const section = (post, title) => {
    const list = c.lists?.[post] || [];
    if (!list.length) return "";
    const top = list.filter((x) => x.main || x.on), off = list.filter((x) => !x.main && !x.on), open = opened.has(c.id + post);
    const on = list.filter((x) => x.on);
    return `<section><div class="sec-head"><h2>${title}</h2><span>${on.length} cochée${on.length > 1 ? "s" : ""}</span>
        ${c.custom?.[post] ? `<button class="link" data-act="reset" data-post="${post}">Revenir au choix de l'IA</button>` : ""}</div>
      ${top.map(row).join("")}
      ${off.length ? `<button class="more" data-act="more" data-post="${post}">${open ? "Masquer" : `Voir ${off.length} autres possibles`}</button>${open ? off.map(row).join("") : ""}` : ""}</section>`;
  };
  const watch = postsData.watch || [];
  const tabs = `<div class="seg chans">${chans.map((x) => `<button data-c="${x.id}" class="${x.id === c.id ? "on" : ""}">${esc(x.label || x.name.replace("grnbl · ", ""))}</button>`).join("")}</div>`;
  const summary = c.id === "carburant" ? `<div class="summary"><div><b>Envoi automatique</b><br><span>Calculé chaque matin sur les prix officiels, rien à relire.</span></div>${sendButton(c, true)}</div>`
    : c.id === "infos" ? `<div class="summary"><div><b>${c.posts.length ? "Alerte à valider" : "Rien de grave"}</b><br><span>Vigilance rouge, air très mauvais, grève du tram : rare, part dans les annonces de la communauté.</span></div>${c.posts.length ? sendButton(c, true) : ""}</div>`
    : `<div class="summary"><div><b>${shown.length} lignes cochées</b><br><span>Coche ou décoche ce qui doit partir, puis valide : l'envoi est programmé.</span></div>
       <div class="acts"><button class="btn keep ${okAll ? "on" : ""}" data-act="all">${okAll ? "Post validé ✓" : "Tout est bon"}</button>${sendButton(c, okAll)}</div></div>`;
  const panes = `<div class="seg panes"><button data-pane="lines" class="${pane === "lines" ? "on" : ""}">Lignes</button><button data-pane="preview" class="${pane === "preview" ? "on" : ""}">Aperçu WhatsApp</button></div>`;
  $("posts").classList.toggle("pane-preview", pane === "preview");
  $("notes").innerHTML = tabs + panes + summary + section("to_book", "À réserver maintenant") + section("week", "Cette semaine") +
    (watch.length && !["carburant", "infos"].includes(c.id) ? `<section><h2>À surveiller</h2>${watch.map((w) =>
      `<div class="prow"><div class="pmain"><div class="pt">👀 ${esc(w.name)}</div><div class="pw">${esc(w.why)} ${w.check.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">vérifier ↗</a>`).join(" ")}</div></div></div>`).join("")}</section>` : "");
  const now = new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  $("phone").innerHTML = `<div class="chan"><div class="avatar">${AVATARS[c.id] || "🎭"}</div><div><b>${esc(c.name)}</b><small>Chaîne · aperçu avant publication</small></div></div>` +
    (c.posts.map((t, k) => `<div class="bubble"><button class="copy" data-k="${k}">Copier</button>${wa(t)}<span class="time">${now}</span></div>`).join("") || `<p class="empty">Rien à poster sur cette chaîne aujourd'hui.</p>`);
  $("phone").querySelectorAll(".copy").forEach((b) => b.addEventListener("click", () => { navigator.clipboard.writeText(c.posts[b.dataset.k]); toast("Post copié"); }));
}

function setView(v) {
  view = v;
  document.body.classList.toggle("v-triage", v === "triage");
  if (v !== "triage") openDetail(false);
  document.documentElement.style.setProperty("--top", document.querySelector(".top").offsetHeight + "px");
  $("triage").hidden = v !== "triage"; $("posts").hidden = v !== "posts";
  document.querySelectorAll("#views button").forEach((b) => b.classList.toggle("on", b.dataset.v === v));
  render();
}

$("views").addEventListener("click", (ev) => { const b = ev.target.closest("button"); if (b) setView(b.dataset.v); });
$("queues").addEventListener("click", (ev) => { const b = ev.target.closest(".q"); if (b) { queue = b.dataset.q; selected = null; render(); } });
$("list").addEventListener("click", (ev) => { const r = ev.target.closest(".row"); if (r) select(Number(r.dataset.i)); });
$("insp").addEventListener("click", (ev) => {
  if (ev.target.closest("[data-back]")) { openDetail(false); if (from === "posts") { from = null; setView("posts"); } return; }
  const b = ev.target.closest("[data-a]"); if (b) decide(b.dataset.a === "undo" ? null : b.dataset.a); });
$("notes").addEventListener("click", async (ev) => {
  const ch = ev.target.closest("[data-c]"); if (ch) { channel = ch.dataset.c; renderPosts(); return; }
  const pn = ev.target.closest("[data-pane]"); if (pn) { pane = pn.dataset.pane; renderPosts(); window.scrollTo(0, 0); return; }
  const act = ev.target.closest("[data-act]"); if (!act) return;
  const c = postsData.channels.find((x) => x.id === channel);
  if (act.dataset.act === "publish") {
    act.disabled = true; act.textContent = "Envoi…";
    const r = await (await fetch("/api/publish", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ channel }) })).json();
    const bad = (r.report || []).filter(([, what]) => what.startsWith("échec"));
    toast(bad.length ? `Échec : ${bad[0][1]}` : "Envoyé sur WhatsApp");
    postsData = null; return renderPosts();
  }
  if (act.dataset.act === "all") {
    for (const x of ticked(c).filter((p) => p.status !== "keep")) await save(events.find((y) => y.i === x.i), { status: "keep", line: x.line });
    toast("Post validé"); return renderPosts();
  }
  if (act.dataset.act === "more") { const k = c.id + act.dataset.post; opened.has(k) ? opened.delete(k) : opened.add(k); return renderPosts(); }
  if (act.dataset.act === "reset") { await choose(c.id, act.dataset.post, null); toast("Choix de l'IA remis"); return renderPosts(); }
  if (act.dataset.act === "open") { queue = "picks"; selected = Number(act.closest(".cand").dataset.i); from = "posts"; setView("triage"); return openDetail(true); }
});

async function choose(channel, post, ids) {
  await fetch("/api/choose", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ channel, post, ids }) });
  postsData = null;
}
// Tick or untick a line: the post becomes the ticked lines, in the list's order.
async function toggle(el) {
  const c = postsData.channels.find((x) => x.id === channel), post = el.dataset.post, i = Number(el.dataset.i);
  const list = c.lists[post], x = list.find((y) => y.i === i);
  x.on = !x.on; el.classList.toggle("on", x.on); el.setAttribute("aria-checked", x.on);
  await choose(channel, post, list.filter((y) => y.on).map((y) => y.i));
  renderPosts();
}
$("notes").addEventListener("click", (ev) => { const el = ev.target.closest(".cand"); if (el && !ev.target.closest("button")) toggle(el); });
$("notes").addEventListener("keydown", (ev) => { const el = ev.target.closest(".cand"); if (el && (ev.key === " " || ev.key === "Enter")) { ev.preventDefault(); toggle(el); } });
$("search").addEventListener("input", (ev) => { query = ev.target.value.trim().toLowerCase(); render(); });

document.addEventListener("keydown", (ev) => {
  const typing = ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName);
  if (ev.key === "Escape") { document.activeElement.blur(); return; }
  if (typing) { if (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) { document.activeElement.blur(); decide("keep"); } return; }
  const k = ev.key.toLowerCase();
  if (k === "1") setView("posts");
  else if (k === "2") setView("triage");
  else if (k === "/") { ev.preventDefault(); $("search").focus(); }
  else if (view !== "triage") return;
  else if (k === "j" || ev.key === "ArrowDown") { ev.preventDefault(); move(1); }
  else if (k === "k" || ev.key === "ArrowUp") { ev.preventDefault(); move(-1); }
  else if (k === "g") decide("keep");
  else if (k === "x") decide("drop");
  else if (k === "u") decide(null);
  else if (k === "e") { ev.preventDefault(); const t = $("line"); t?.focus(); t?.setSelectionRange(t.value.length, t.value.length); }
});

if (phone()) $("search").placeholder = "Rechercher";
fetch("/api/events").then((r) => r.json()).then((d) => {
  events = d.events;
  $("day").textContent = new Date(d.day + "T12:00").toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
  if (d.state !== "ready") return waitForRun(d);
  render();
});

// No posts yet today: say why, and reload by itself once the morning run is done.
function waitForRun(d) {
  const say = {
    preparing: `La préparation du jour tourne depuis ${d.since}. Elle prend 10 à 15 minutes ; cette page se recharge toute seule quand c'est prêt.`,
    failed: `La préparation du jour a échoué. Journal : ${d.log}. Nouvel essai automatique à 14 h.`,
    none: "Pas encore de préparation aujourd'hui : elle part à 10 h, et le message Discord arrive quand c'est prêt.",
  }[d.state];
  const box = `<p class="empty">${esc(say)}</p>`;
  for (const id of ["list", "insp", "notes", "phone"]) if ($(id)) $(id).innerHTML = box;
  setTimeout(async () => {
    const again = await (await fetch("/api/events")).json();
    if (again.state === "ready") location.reload(); else waitForRun(again);
  }, 60_000);
}
</script>
