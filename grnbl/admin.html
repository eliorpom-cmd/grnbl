<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>grnbl · tableau</title>
<style>
  :root { --bg:#f5f5f7; --card:#fff; --ink:#1d1d1f; --mute:#6e6e73; --line:#e5e5ea; --keep:#1f8a4c; --drop:#c0392b; --accent:#0a66ff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --card:#1c1c1e; --ink:#f5f5f7; --mute:#98989d; --line:#38383a; --accent:#4c8dff; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  header { position:sticky; top:0; z-index:2; background:color-mix(in srgb,var(--bg) 85%,transparent); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
  .bar { max-width:860px; margin:0 auto; padding:14px 16px 0; }
  h1 { margin:0 0 10px; font-size:24px; letter-spacing:-.01em; }
  .tabs { display:flex; gap:4px; overflow-x:auto; }
  .tabs button { border:0; background:none; color:var(--mute); font:inherit; padding:8px 12px; border-bottom:2px solid transparent; cursor:pointer; white-space:nowrap; }
  .tabs button.on { color:var(--ink); border-color:var(--accent); font-weight:600; }
  .filters { display:flex; gap:8px; padding:8px 0 10px; flex-wrap:wrap; }
  .chip { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:99px; padding:4px 12px; font:inherit; font-size:13px; cursor:pointer; }
  .chip.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  main { max-width:860px; margin:0 auto; padding:16px; display:grid; gap:10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
  .card.drop { opacity:.6; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:8px; vertical-align:middle; background:var(--line); }
  .card.keep .dot { background:var(--keep); } .card.drop .dot { background:var(--drop); }
  .top { display:flex; justify-content:space-between; gap:12px; }
  .title { font-weight:600; font-size:19px; line-height:1.3; }
  .meta { color:var(--mute); font-size:13px; margin-top:2px; }
  .score { color:var(--accent); letter-spacing:1px; white-space:nowrap; }
  .tag { display:inline-block; font-size:12px; padding:1px 8px; border-radius:99px; background:var(--bg); margin-right:4px; }
  .why { color:var(--drop); font-size:13px; margin-top:6px; }
  textarea { width:100%; margin-top:8px; border:1px solid var(--line); border-radius:10px; padding:8px 10px; font:inherit; background:var(--bg); color:var(--ink); resize:vertical; min-height:40px; }
  .actions { display:flex; gap:8px; margin-top:8px; align-items:center; }
  .actions button { border:0; border-radius:10px; padding:7px 14px; font:inherit; font-weight:600; cursor:pointer; }
  .b-keep { background:var(--keep); color:#fff; } .b-drop { background:var(--line); color:var(--ink); }
  .actions a { margin-left:auto; color:var(--accent); font-size:13px; text-decoration:none; }
  .human { font-size:12px; color:var(--mute); }
  pre { white-space:pre-wrap; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; font:14px/1.5 -apple-system,sans-serif; margin:0; }
  .empty { color:var(--mute); text-align:center; padding:40px 0; }
</style>
</head>
<body>
<header><div class="bar">
  <h1>grnbl · <span id="day"></span></h1>
  <div class="tabs" id="tabs"></div>
  <div class="filters" id="filters">
    <button class="chip" data-f="free">Gratuit</button>
    <button class="chip" data-f="family">En famille</button>
    <button class="chip" data-f="week">Cette semaine</button>
  </div>
</div></header>
<main id="list"></main>
<script>
const TABS = [
  ["todo", "À valider"], ["kept", "Gardés"], ["dropped", "Écartés"], ["dupes", "Doublons"], ["posts", "Posts"],
];
let events = [], tab = "todo", filters = new Set();
const TIMING = { book_now: "📅 à réserver", opens_soon: "⏰ résa bientôt", this_week: "cette semaine", too_late: "trop tard", sold_out: "complet", later: "plus tard" };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function status(e) {
  if (e.decision?.status) return e.decision.status;          // human
  if (e.review?.duplicate_of != null) return "dupe";
  return e.review?.keep ? "ai-keep" : "ai-drop";
}
function inTab(e) {
  const s = status(e);
  if (tab === "todo") return s === "ai-keep";
  if (tab === "kept") return s === "keep";
  if (tab === "dropped") return s === "drop" || s === "ai-drop";
  if (tab === "dupes") return s === "dupe";
  return false;
}
function passes(e) {
  if (filters.has("free") && !e.review?.free) return false;
  if (filters.has("family") && !e.review?.family) return false;
  if (filters.has("week")) {
    const d = new Date(String(e.start).slice(0, 10)), now = new Date();
    if (d - now > 7 * 864e5) return false;
  }
  return true;
}
function when(e) {
  const d = new Date(String(e.start).length > 10 ? e.start : e.start + "T00:00");
  const day = d.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" });
  return String(e.start).length > 10 ? day + " " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) : day;
}

function renderTabs() {
  $("tabs").innerHTML = TABS.map(([k, label]) => {
    const n = k === "posts" ? "" : ` (${events.filter((e) => { const t = tab; tab = k; const r = inTab(e) && passes(e); tab = t; return r; }).length})`;
    return `<button class="${k === tab ? "on" : ""}" data-t="${k}">${label}${n}</button>`;
  }).join("");
}

async function render() {
  renderTabs();
  $("filters").hidden = tab === "posts";
  if (tab === "posts") {
    const p = await (await fetch("/api/posts")).json();
    const watch = (p.watch || []).map((w) => `<li><b>${esc(w.name)}</b> · ${esc(w.why)} ${w.check.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">vérifier ↗</a>`).join(" ")}</li>`).join("");
    $("list").innerHTML = (watch ? `<article class="card"><div class="title">👀 À surveiller (dates pas encore annoncées)</div><ul>${watch}</ul></article>` : "")
      + ([p.to_book, p.outings, p.fuel].filter(Boolean).map((t) => `<pre>${esc(t)}</pre>`).join("") || `<p class="empty">Rien à poster.</p>`);
    return;
  }
  const rows = events.filter((e) => inTab(e) && passes(e))
    .sort((a, b) => (b.review?.score ?? 0) - (a.review?.score ?? 0) || String(a.start).localeCompare(String(b.start)));
  $("list").innerHTML = rows.map((e) => {
    const s = status(e), r = e.review || {};
    const cls = s === "keep" || s === "ai-keep" ? "keep" : s === "drop" || s === "ai-drop" ? "drop" : "";
    return `<article class="card ${cls}" data-i="${e.i}">
      <div class="top"><div>
        <div class="title"><span class="dot"></span>${esc(e.title)}</div>
        <div class="meta">${esc(when(e))} · ${esc(e.venue || e.town || "lieu ?")} · ${esc(e.source_name)}${e.also ? " +" + e.also.length : ""}</div>
      </div><div class="score" title="intérêt">${"●".repeat(r.score || 0)}${"○".repeat(5 - (r.score || 0))}</div></div>
      <div style="margin-top:6px">${TIMING[e.timing] ? `<span class="tag">${TIMING[e.timing]}</span>` : ""}${e.booking === "required" ? `<span class="tag">réservation${e.booking_opens ? " dès " + esc(String(e.booking_opens).slice(0, 10)) : ""}</span>` : ""}${r.rare ? '<span class="tag">✨ rare</span>' : ""}${r.free ? '<span class="tag">🆓 gratuit</span>' : e.price ? `<span class="tag">${esc(e.price)}</span>` : ""}${r.family ? '<span class="tag">👨‍👩‍👧 famille</span>' : ""}${e.category ? `<span class="tag">${esc(e.category)}</span>` : ""}</div>
      ${r.keep === false && r.why ? `<div class="why">IA : ${esc(r.why)}</div>` : ""}
      ${s === "dupe" ? `<div class="why">Doublon de #${r.duplicate_of}</div>` : ""}
      <textarea rows="2">${esc(e.decision?.line || r.line || "")}</textarea>
      <div class="actions">
        <button class="b-keep" data-a="keep">Garder</button>
        <button class="b-drop" data-a="drop">Écarter</button>
        ${e.decision ? `<span class="human">décidé par toi · <a href="#" data-a="undo">annuler</a></span>` : ""}
        ${e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">source ↗</a>` : ""}
      </div>
    </article>`;
  }).join("") || `<p class="empty">Rien ici.</p>`;
}

async function decide(i, decision) {
  await fetch("/api/decide", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ i, decision }) });
  const e = events.find((x) => x.i === i);
  e.decision = decision;
  render();
}

$("list").addEventListener("click", (ev) => {
  const a = ev.target.closest("[data-a]");
  if (!a) return;
  ev.preventDefault();
  const card = a.closest(".card"), i = Number(card.dataset.i);
  if (a.dataset.a === "undo") return decide(i, null);
  decide(i, { status: a.dataset.a, line: card.querySelector("textarea").value.trim() });
});
$("tabs").addEventListener("click", (ev) => { const b = ev.target.closest("button"); if (b) { tab = b.dataset.t; render(); } });
$("filters").addEventListener("click", (ev) => {
  const b = ev.target.closest(".chip"); if (!b) return;
  filters.has(b.dataset.f) ? filters.delete(b.dataset.f) : filters.add(b.dataset.f);
  b.classList.toggle("on"); render();
});

fetch("/api/events").then((r) => r.json()).then((d) => {
  events = d.events; $("day").textContent = new Date(d.day).toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
  render();
});
</script>
</body>
</html>
