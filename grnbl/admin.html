<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>grnbl · editor</title>
<style>
  :root {
    --bg: #fbfbfd; --panel: #ffffff; --hover: #f2f2f5; --line: rgba(0, 0, 0, .08);
    --ink: #1d1d1f; --body: #515154; --mute: #86868b;
    --accent: #0071e3; --keep: #1a7f37; --drop: #c4314b; --warn: #b25e09;
    --wa-bg: #efeae2; --wa-bubble: #ffffff; --wa-ink: #111b21; --wa-meta: #667781; --wa-link: #027eb5;
    --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 8px 24px rgba(0, 0, 0, .06);
    --ease: cubic-bezier(0.4, 0, 0.2, 1); --expo: cubic-bezier(0.16, 1, 0.3, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0b0d; --panel: #141416; --hover: #1c1c1f; --line: rgba(255, 255, 255, .08);
      --ink: #f5f5f7; --body: #b4b4b9; --mute: #7c7c82;
      --accent: #3b93ff; --keep: #3fb950; --drop: #ff6b81; --warn: #f0a04b;
      --wa-bg: #0b141a; --wa-bubble: #202c33; --wa-ink: #e9edef; --wa-meta: #8696a0; --wa-link: #53bdeb;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }
  kbd { font: 11px/1 -apple-system, sans-serif; color: var(--mute); border: 1px solid var(--line); border-radius: 4px; padding: 2px 5px; background: var(--panel); }
  .empty { color: var(--mute); text-align: center; padding: 64px 24px; }

  /* Top bar */
  .top { height: 52px; flex: none; display: flex; align-items: center; gap: 16px; padding: 0 16px; border-bottom: 1px solid var(--line); }
  .brand { font-weight: 650; letter-spacing: -.02em; font-size: 16px; }
  .day { color: var(--mute); }
  .seg { display: flex; background: var(--hover); border-radius: 8px; padding: 2px; }
  .seg button { border: 0; background: none; padding: 4px 14px; border-radius: 6px; color: var(--body); white-space: nowrap; transition: background .18s var(--ease), color .18s var(--ease); }
  .seg button.on { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .top .lang { margin-left: auto; }
  .top .lang button { padding: 4px 10px; font-size: 12.5px; }

  /* Groups strip, shared by both tabs: which group, how far */
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); color: var(--body); white-space: nowrap; transition: background .15s var(--ease), border-color .15s var(--ease); }
  .chip small { color: var(--mute); font-size: 12px; }
  .chip.on { border-color: var(--ink); color: var(--ink); font-weight: 600; }
  .chip.done { background: color-mix(in srgb, var(--keep) 10%, var(--panel)); }
  .chip.done small { color: var(--keep); font-weight: 600; }

  .btn { height: 36px; border-radius: 99px; padding: 0 16px; border: 1px solid var(--line); background: var(--panel); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; transition: transform .15s var(--ease), background .15s var(--ease); }
  .btn:active { transform: scale(.97); }
  .btn.dark { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn.send { background: var(--keep); border-color: var(--keep); color: #fff; }
  .btn:disabled { opacity: .55; cursor: default; }
  .ok-note { color: var(--keep); font-weight: 600; }

  /* WhatsApp text, also used inside the cards; editable spots show it on hover and focus */
  .wa { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--wa-ink); font: 14.2px/1.42 -apple-system, "Helvetica Neue", sans-serif; }
  .wa a { color: var(--wa-link); }
  [contenteditable] { outline: none; border-radius: 6px; transition: box-shadow .15s var(--ease), background .15s var(--ease); cursor: text; }
  [contenteditable]:hover { box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent); }
  [contenteditable]:focus { box-shadow: 0 0 0 2px var(--accent); background: color-mix(in srgb, var(--accent) 4%, transparent); }
  .edited { font-size: 11.5px; color: var(--accent); font-weight: 600; margin-top: 4px; display: flex; gap: 10px; }
  .edited button { border: 0; background: none; padding: 0; color: var(--mute); font-size: 11.5px; text-decoration: underline; }

  /* ---------- Review: cards on the left, the event's details on the right ---------- */
  .review { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .rv-main { overflow: auto; display: flex; flex-direction: column; align-items: center; padding: 20px 24px 32px; border-right: 1px solid var(--line); }
  .rv-head { width: 100%; max-width: 560px; margin: 0 0 18px; }
  .rv-group { display: flex; align-items: center; gap: 12px; margin: 16px 0 0; }
  .rv-group .emo { width: 44px; height: 44px; border-radius: 12px; background: var(--hover); display: grid; place-items: center; font-size: 22px; flex: none; }
  .rv-group h2 { margin: 0; font-size: 20px; letter-spacing: -.01em; line-height: 1.2; }
  .rv-group p { margin: 0; color: var(--mute); font-size: 13px; }
  .rv-bar { height: 4px; border-radius: 99px; background: var(--hover); margin-top: 14px; overflow: hidden; }
  .rv-bar i { display: block; height: 100%; background: var(--keep); border-radius: inherit; transform-origin: 0 50%; transition: transform .6s var(--expo); }
  .stack { position: relative; width: 100%; max-width: 560px; display: grid; }
  .stack > * { grid-area: 1 / 1; }
  .rcard { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 22px 24px 24px; box-shadow: var(--shadow);
    transform-origin: 50% 100%; touch-action: pan-y; transition: transform .6s var(--expo), opacity .6s var(--expo); }
  .rcard.back1, .rcard.back2 { position: absolute; inset: 0; padding: 0; pointer-events: none; }
  .rcard.back1 { transform: translateY(14px) scale(.955); opacity: .7; }
  .rcard.back2 { transform: translateY(28px) scale(.91); opacity: .35; }
  .rcard.drag { transition: none; cursor: grabbing; user-select: none; }
  .rcard.out-keep { transform: translateX(120%) rotate(8deg); opacity: 0; transition-duration: .45s; }
  .rcard.out-drop { transform: translateX(-120%) rotate(-8deg); opacity: 0; transition-duration: .45s; }
  .rcard.out-later { transform: translateY(-110%) scale(.96); opacity: 0; transition-duration: .45s; }
  .rcard.enter { transform: translateY(14px) scale(.955); opacity: .7; }
  .rc-top { color: var(--mute); font-size: 13px; margin: 0 0 12px; }
  .rc-top b { color: var(--body); font-weight: 600; }
  .rc-new { display: inline-block; margin: 0 0 10px; font-size: 12px; font-weight: 600; color: var(--accent); }
  .rc-title { margin: 0; font-size: 24px; line-height: 1.2; letter-spacing: -.02em; font-weight: 650; text-wrap: balance; }
  .rc-meta { margin: 6px 0 18px; color: var(--body); }
  .rc-cap { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--mute); margin: 0 0 6px; }
  .rc-cap span:last-child { font-weight: 400; }
  .rc-msg { background: var(--wa-bg); border-radius: 14px; padding: 12px 14px; max-height: 36vh; overflow: auto; }
  .rc-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 18px 0 0; }
  .rc-facts dt { font-size: 12px; color: var(--mute); }
  .rc-facts dd { margin: 2px 0 0; color: var(--ink); font-weight: 550; overflow-wrap: anywhere; }
  .rc-facts dd small { display: block; font-weight: 400; color: var(--body); font-size: 13px; }
  .rc-why { margin: 18px 0 0; color: var(--body); }
  .rc-why b, .dt-sec b { display: block; font-size: 12px; color: var(--mute); font-weight: 600; margin-bottom: 2px; }
  .rc-warn { margin: 14px 0 0; padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--warn) 12%, transparent); color: var(--warn); font-weight: 550; }
  .stamp { position: absolute; top: 22px; padding: 4px 12px; border-radius: 10px; border: 2px solid; font-weight: 700; font-size: 15px; opacity: 0; pointer-events: none; background: var(--panel); z-index: 2; }
  .stamp.keep { right: 22px; color: var(--keep); transform: rotate(6deg); }
  .stamp.drop { left: 22px; color: var(--drop); transform: rotate(-6deg); }
  .stamp.later { left: 50%; color: var(--warn); transform: translateX(-50%); }
  .rv-acts { display: flex; align-items: center; justify-content: center; gap: 28px; margin: 28px 0 0; }
  .rv-btn { display: grid; justify-items: center; gap: 6px; border: 0; background: none; color: var(--mute); font-size: 12px; font-weight: 500; }
  .rv-btn span { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; background: var(--panel); border: 1px solid var(--line);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .05), 0 6px 16px rgba(0, 0, 0, .06); transition: transform .15s var(--ease), background .15s var(--ease), color .15s var(--ease); }
  .rv-btn.keep span { color: var(--keep); } .rv-btn.drop span { color: var(--drop); }
  .rv-btn.later span { width: 52px; height: 52px; font-size: 22px; font-weight: 600; color: var(--warn); }
  .rv-btn.undo span { width: 44px; height: 44px; color: var(--body); }
  .rv-btn:disabled { opacity: .35; cursor: default; }
  @media (hover: hover) { .rv-btn.keep:not(:disabled):hover span { background: var(--keep); color: #fff; } .rv-btn.drop:not(:disabled):hover span { background: var(--drop); color: #fff; } .rv-btn.later:hover span { background: var(--warn); color: #fff; } }
  .rv-btn:not(:disabled):active span { transform: scale(.92); }
  .rv-keys { margin-top: 18px; color: var(--mute); font-size: 12px; display: flex; gap: 14px; }
  .rc-done { text-align: center; padding: 36px 24px 32px; }
  .rc-done .big { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%; display: grid; place-items: center; background: var(--keep); color: #fff; font-size: 30px; }
  .rc-done p { color: var(--body); margin: 6px 0 22px; }
  .rc-done ul { list-style: none; padding: 0; margin: 0 0 24px; text-align: left; }
  .rc-done li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .rc-done li span { color: var(--mute); text-align: right; }
  .rc-done li a { font-size: 13px; }

  /* Details of the card in front */
  .rv-detail { overflow: auto; padding: 28px 32px 40px; }
  .rv-detail.swap { animation: fadein .5s var(--expo); }
  @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .dt-kicker { color: var(--mute); font-size: 12px; font-weight: 600; margin: 0 0 8px; }
  .dt-title { margin: 0 0 6px; font-size: 22px; line-height: 1.2; letter-spacing: -.02em; font-weight: 650; }
  .dt-desc { color: var(--body); margin: 0 0 22px; white-space: pre-line; }
  .dt-facts { display: grid; grid-template-columns: 112px 1fr; gap: 8px 14px; margin: 0 0 22px; }
  .dt-facts dt { color: var(--mute); }
  .dt-facts dd { margin: 0; overflow-wrap: anywhere; white-space: pre-line; }
  .dt-sec { border-radius: 14px; background: var(--hover); padding: 12px 14px; margin: 0 0 12px; color: var(--body); }
  .dt-link { display: inline-flex; margin: 4px 0 22px; }

  /* ---------- Messages: each group's WhatsApp chat, editable in place ---------- */
  .msgs { flex: 1; min-height: 0; overflow: auto; background: var(--wa-bg); }
  .msgs-in { max-width: 720px; margin: 0 auto; padding: 0 16px 48px; }
  .msgs-bar { position: sticky; top: 0; z-index: 2; margin: 0 -16px 18px; padding: 14px 16px 12px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  .msgs-state { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; }
  .msgs-state span { color: var(--body); }
  .chat-head { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--panel); display: grid; place-items: center; font-size: 20px; }
  .chat-head small { display: block; color: var(--wa-meta); }
  .chat-head b { color: var(--wa-ink); }
  .bubble { position: relative; background: var(--wa-bubble); border-radius: 8px; padding: 8px 10px 22px; margin: 0 0 8px; box-shadow: 0 1px .5px rgba(11, 20, 26, .13); }
  .bubble .time { position: absolute; right: 10px; bottom: 4px; font-size: 11px; color: var(--wa-meta); }
  .bubble .copy { position: absolute; right: 6px; top: 6px; border: 0; border-radius: 6px; background: var(--hover); color: var(--body); font-size: 12px; padding: 2px 8px; opacity: 0; transition: opacity .15s var(--ease); }
  .bubble:hover .copy { opacity: 1; }
  .blk { margin: 12px -4px 0; padding: 2px 4px; }
  .blk.todo { box-shadow: inset 3px 0 0 color-mix(in srgb, var(--warn) 70%, transparent); }
  .tip { color: var(--wa-meta); font-size: 12.5px; margin: 0 4px 16px; }
  .en { margin: 0 4px 24px; padding: 2px 0 2px 12px; border-left: 2px solid color-mix(in srgb, var(--wa-meta) 50%, transparent); color: var(--wa-meta);
    white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.45 -apple-system, "Helvetica Neue", sans-serif; }
  .en .en-h { display: block; margin-bottom: 4px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; white-space: normal; }
  .en a { color: inherit; }

  .toast { position: fixed; left: 50%; bottom: 32px; z-index: 20; transform: translate(-50%, 12px); opacity: 0; background: var(--ink); color: var(--bg); border-radius: 99px; padding: 8px 16px; font-weight: 500; transition: opacity .2s var(--ease), transform .2s var(--ease); pointer-events: none; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* Phone: one column, the details under the card */
  @media (max-width: 900px) {
    html, body { height: auto; }
    kbd, .rv-keys, .day { display: none; }
    .top { position: sticky; top: 0; z-index: 5; gap: 10px; padding: 8px 16px; padding-top: max(8px, env(safe-area-inset-top)); height: auto; min-height: 52px; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(12px); }
    .seg button { min-height: 34px; }
    .review { display: block; }
    .rv-main { border: 0; padding: 12px 16px 8px; overflow: visible; }
    .rcard { padding: 18px 18px 20px; }
    .rc-title { font-size: 22px; }
    .rc-msg { max-height: none; }
    .rv-detail { overflow: visible; padding: 24px 16px 48px; border-top: 1px solid var(--line); }
    .msgs { overflow: visible; }
    .bubble .copy { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top">
  <span class="brand">grnbl</span>
  <span class="day" id="day"></span>
  <div class="seg" id="views">
    <button data-v="review" class="on"></button>
    <button data-v="msgs"></button>
  </div>
  <div class="seg lang" id="lang"><button data-l="en">EN</button><button data-l="fr">FR</button></div>
</header>

<div class="review" id="review"><div class="rv-main" id="rv-main"></div><aside class="rv-detail" id="rv-detail"></aside></div>
<div class="msgs" id="msgs" hidden><div class="msgs-in" id="msgs-in"></div></div>
<div class="toast" id="toast"></div>

<script>
// ---------- Language: English by default (the jury), French on demand, remembered per browser ----------
let lang = "en";
try { lang = localStorage.getItem("grnbl-lang") || "en"; } catch {}
const L = (en, fr) => (lang === "fr" ? fr : en);
const loc = () => (lang === "fr" ? "fr-FR" : "en-GB");
const NAMES = {
  gratuit: ["🆓 Free", "🆓 Gratuit"], sorties: ["🎭 Outings", "🎭 Sorties"], famille: ["👨‍👩‍👧 Family", "👨‍👩‍👧 Famille"],
  bonsplans: ["🛍️ Deals", "🛍️ Bons plans"], nature: ["🏔️ Outdoors", "🏔️ Nature"], infos: ["🚨 Alerts", "🚨 Alertes"], carburant: ["⛽ Fuel", "⛽ Carburant"],
};
const label = (c) => (NAMES[c.id] ? NAMES[c.id][lang === "fr" ? 1 : 0] : c.label || c.name);
const emoji = (c) => [...label(c)][0];
const DAILY = ["carburant", "infos"];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const toast = (t) => { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove("on"), 1600); };
const post2 = (url, body) => fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });

function when(raw, short) {
  if (!raw) return "";
  const s = String(raw), d = new Date(s.length > 10 ? s : s + "T00:00");
  const day = d.toLocaleDateString(loc(), short ? { weekday: "short", day: "numeric", month: "short" } : { weekday: "long", day: "numeric", month: "long" });
  return s.length > 10 ? `${day} · ${d.toLocaleTimeString(loc(), { hour: "2-digit", minute: "2-digit" })}` : day;
}
const sendTime = (iso) => { const d = new Date(iso); return `${d.toLocaleDateString(loc(), { weekday: "long" })} ${d.toLocaleTimeString(loc(), { hour: "2-digit", minute: "2-digit" })}`; };

// WhatsApp formatting: *bold*, _italic_, links. And back: what an edited block becomes as WhatsApp text.
function wa(text) {
  return esc(text)
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<b>$2</b>")
    .replace(/(^|[\s(])_([^_\n]+)_/g, "$1<i>$2</i>");
}
function toWa(el) {
  const walk = (n) => [...n.childNodes].map((c) => {
    if (c.nodeType === 3) return c.textContent;
    if (c.nodeType !== 1) return "";
    const t = c.tagName, inner = walk(c);
    if (t === "BR") return "\n";
    if (t === "B" || t === "STRONG") return inner.trim() ? `*${inner.trim()}*` : inner;
    if (t === "I" || t === "EM") return inner.trim() ? `_${inner.trim()}_` : inner;
    if (t === "DIV" || t === "P") return "\n" + inner;
    return inner;
  }).join("");
  // A blank line would split the block in two posts' worth of parts: keep single line breaks.
  return walk(el).replace(/ /g, " ").replace(/\n{2,}/g, "\n").replace(/^\n+|\s+$/g, "");
}

let events = [], data = null, view = "review", channel = null;

async function load() { data = await (await fetch("/api/posts")).json(); }
const groups = () => data.channels.filter((c) => c.lists && !DAILY.includes(c.id));
const ticked = (c) => ["to_book", "week"].flatMap((post) => (c.lists?.[post] || []).filter((x) => x.on));
function progress(c) {
  const on = ticked(c), left = on.filter((x) => x.status !== "keep").length, out = Object.values(c.outbox || {});
  return { total: on.length, left, done: on.length > 0 && left === 0, sent: out.length > 0 && out.every((r) => r.status === "sent") };
}
// Lines of a post in their list order, as the server wants them.
const onIds = (c, post) => c.lists[post].filter((y) => y.on).map((y) => y.i);
const choose = (c, post) => post2("/api/choose", { channel: c.id, post, ids: onIds(c, post) });
// A decision keeps the hand-edited block along with the status.
const decide = (x, status, block = x.block) => post2("/api/decide", { i: x.i, decision: status || block ? { status: status || null, line: x.line, block: block || null } : null });

function chips(current, onlyGroups) {
  return `<div class="chips">${data.channels.filter((c) => !onlyGroups || !DAILY.includes(c.id)).map((c) => {
    const g = c.lists && !DAILY.includes(c.id) ? progress(c) : null;
    const st = !g ? `<small>${L("auto", "auto")}</small>` : g.sent ? `<small>${L("sent", "envoyé")} ✓</small>` : g.done ? `<small>✓</small>` : g.total ? `<small>${g.left} ${L("left", "restantes")}</small>` : `<small>–</small>`;
    return `<button class="chip ${c.id === current ? "on" : ""} ${g?.done ? "done" : ""}" data-c="${c.id}">${esc(label(c))} ${st}</button>`;
  }).join("")}</div>`;
}

// ---------- Review ----------
// Pass 1, group by group: Keep (decision "keep"), Remove (the line leaves its post, the editor's next unused
// reserve comes up as a replacement card) or Check later (set aside, nothing changes). Pass 2: the set-aside
// cards again, details on the right; what is chosen there is only noted, then applied together on the last card.
// All of it is stored on the server (/api/review), so a closed tab resumes exactly where it was.
const rv = { queue: [], done: [], busy: false, anim: false, inter: null };
const st = () => (data.review ||= { pending: [], passed: [], later: [], verdicts: {} });
const findLine = (cid, post, i) => { const c = data.channels.find((y) => y.id === cid); return c && { c, x: c.lists?.[post]?.find((y) => y.i === i) }; };

// The queue is worked out again from the stored state after every action: done cards simply drop out.
function buildQueue() {
  const s = st(), later = new Set(s.later.map((p) => p.i)), passed = new Set(s.passed);
  const q = [];
  for (const c of groups()) {

// The editor's reserves first, then the channel's next best: one replacement card after a removal.
function replacement(c, x) {

}
const edited = (front, x) => {

  const text = toWa(ed), shown = (x.sent || x.block || `*${x.title}*\n   ${x.line}`).trim();
  return text && text !== shown ? text : null;

async function act(kind) {
  const q = rv.inter || rv.queue[0];
  if (rv.busy || !q || !["line", "check"].includes(q.kind) || (kind === "later" && q.kind !== "line")) return;
  rv.busy = true;
  const { c, x } = q, s = st(), front = $("rv-main").querySelector(".rcard.front"), block = edited(front, x);
  front?.classList.remove("drag"); front?.style.removeProperty("transform");
  front?.classList.add({ keep: "out-keep", drop: "out-drop", later: "out-later" }[kind]);
  const step = { kind, c, x, before: { on: x.on, status: x.status, block: x.block }, state: JSON.stringify(s) };
  if (q.kind === "check") {
    s.verdicts[x.i] = { v: kind, block };  // noted only: applied together on the last card
  } else if (kind === "later") {
    s.later.push({ channel: c.id, post: x.post, i: x.i, instead: q.instead || "" });
  } else if (kind === "keep") {
    if (!x.on) { x.on = true; await choose(c, x.post); }  // a replacement joins the post
    if (block) x.block = block;
    x.status = "keep"; await decide(x, "keep");
  } else {
    if (x.on) { x.on = false; await choose(c, x.post); } else s.passed.push(x.i);
    replacement(c, x);
  }
  rv.done.push(step);
  await saveState();
  await new Promise((r) => setTimeout(r, 260));
  const prev = rv.inter ? null : q;
  rv.inter = null;
  buildQueue();
  // A group card when the group is finished, an intro card when the second pass starts.
  const next = rv.queue[0];
  if (prev?.kind === "line" && (next?.kind !== "line" || next.c !== prev.c)) rv.inter = { kind: "group", c: prev.c };
  rv.busy = false; rv.anim = true;
  renderReview();
}

// Past an in-between card: the second pass opens with its own card.
function advance() {
  const wasGroup = rv.inter?.kind === "group";
  rv.inter = wasGroup && rv.queue[0]?.kind === "check" ? { kind: "intro", n: rv.queue.filter((y) => y.kind === "check").length } : null;
  rv.anim = true; renderReview();
}

async function applyBatch() {
  const s = st(), checks = s.later.map((p) => findLine(p.channel, p.post, p.i)).filter((y) => y?.x);
  for (const { c, x } of checks) {
    const v = s.verdicts[x.i]; if (!v) continue;
    if (v.v === "keep") {
      if (!x.on) { x.on = true; await choose(c, x.post); }
      if (v.block) x.block = v.block;
      x.status = "keep"; await decide(x, "keep");
    } else {
      if (x.on) { x.on = false; await choose(c, x.post); } else s.passed.push(x.i);
      replacement(c, x);
    }
  }
  const n = Object.keys(s.verdicts).length;
  s.later = []; s.verdicts = {}; rv.done = [];
  await saveState(); await load(); buildQueue(); rv.anim = true;
  toast(`${n} ${L("decisions applied", "décisions appliquées")}`);
  renderReview();
}

async function undo() {
  const step = rv.done.pop();
  if (!step || rv.busy) return;
  const { c, x } = step;
  data.review = JSON.parse(step.state);
  if (x.on !== step.before.on) { x.on = step.before.on; await choose(c, x.post); }
  if (x.status !== step.before.status || x.block !== step.before.block) { x.status = step.before.status; x.block = step.before.block; await decide(x, x.status, x.block); }
  await saveState();
  rv.inter = null; buildQueue();
  toast(L("Undone", "Annulé")); renderReview();
}

// Drag the front card: right keeps, left removes, up sets it aside; a short drag springs back.
// The message box is for editing, so it never starts a drag.
function drag(el, canLater) {
  let p0 = null, dx = 0, dy = 0;
  const stamps = { keep: el.querySelector(".stamp.keep"), drop: el.querySelector(".stamp.drop"), later: el.querySelector(".stamp.later") };
  el.addEventListener("pointerdown", (ev) => { if (ev.target.closest("button, a, [data-edit]")) return; p0 = [ev.clientX, ev.clientY]; dx = dy = 0; el.setPointerCapture(ev.pointerId); el.classList.add("drag"); });
  el.addEventListener("pointermove", (ev) => {
    if (!p0) return;
    dx = ev.clientX - p0[0]; dy = canLater ? Math.min(0, ev.clientY - p0[1]) : 0;
    el.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx / 24}deg)`;
    const up = -dy > Math.abs(dx);
    stamps.keep.style.opacity = up ? 0 : Math.max(0, Math.min(1, dx / 100)); stamps.drop.style.opacity = up ? 0 : Math.max(0, Math.min(1, -dx / 100));
    stamps.later.style.opacity = up ? Math.min(1, -dy / 100) : 0;
  });
  const end = () => {
    if (!p0) return;
    p0 = null;
    if (canLater && -dy > 110 && -dy > Math.abs(dx)) return act("later");
    if (Math.abs(dx) > 110) return act(dx > 0 ? "keep" : "drop");
    el.classList.remove("drag"); el.style.removeProperty("transform"); Object.values(stamps).forEach((s) => (s.style.opacity = 0));
  };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
}

$("rv-main").addEventListener("click", async (ev) => {
  const ch = ev.target.closest("[data-c]");
  if (ch) { channel = ch.dataset.c; return setView("msgs"); }
  const vb = ev.target.closest("[data-verdict]");
  if (vb) { const s = st(), i = Number(vb.dataset.i); s.verdicts[i] = { ...(s.verdicts[i] || {}), v: vb.dataset.verdict }; await saveState(); buildQueue(); return renderReview(); }
  const b = ev.target.closest("[data-rv]"); if (!b) return;
  const k = b.dataset.rv;
  if (k === "keep" || k === "drop" || k === "later") act(k);
  else if (k === "undo") undo();
  else if (k === "next") advance();
  else if (k === "apply") { b.disabled = true; applyBatch(); }
  else if (k === "msgs") setView("msgs");
});

function renderMsgs() {
  const c = data.channels.find((x) => x.id === channel) || groups()[0];
  channel = c.id;
  const g = c.lists && !DAILY.includes(c.id) ? progress(c) : null;
  const rows = Object.fromEntries(["to_book", "week"].flatMap((p) => (c.lists?.[p] || []).map((x) => [x.i, x])));
  const state = c.id === "carburant" ? `<span>${L("Sent automatically every morning, nothing to review.", "Envoyé automatiquement chaque matin, rien à relire.")}</span>${sendButton(c, true)}`
    : c.id === "infos" ? `<span>${c.posts.length ? L("Alert to approve: it goes to the community announcements.", "Alerte à valider : elle part dans les annonces de la communauté.") : L("Nothing serious right now.", "Rien de grave en ce moment.")}</span>${c.posts.length ? sendButton(c, true) : ""}`
    : g.done ? `<span>${g.total} ${L("lines checked", "lignes vérifiées")}</span>${sendButton(c, true)}`
    : `<span>${g.left} / ${g.total} ${L("lines still to check", "lignes encore à vérifier")}</span><button class="btn dark" data-act="review">${L("Check them →", "Les vérifier →")}</button>`;
  const now = new Date().toLocaleTimeString(loc(), { hour: "2-digit", minute: "2-digit" });
  const bubbles = c.parts ? c.parts.map((p, k) => `<div class="bubble"><button class="copy" data-k="${k}">${L("Copy", "Copier")}</button>
      <div class="wa">${wa(p.head)}</div>
      ${p.blocks.map((b) => { const x = rows[b.i];
        return `<div class="blk ${x && x.status !== "keep" ? "todo" : ""}">${x ? `<div class="wa" contenteditable="true" spellcheck="true" data-i="${b.i}">${wa(b.text)}</div>${x.block ? `<div class="edited">${L("Edited by hand", "Modifié à la main")}<button data-act="restore" data-i="${b.i}">${L("restore the original", "revenir à l'original")}</button></div>` : ""}` : `<div class="wa">${wa(b.text)}</div>`}</div>`; }).join("")}
      <span class="time">${now}</span></div>${english(c.en?.[k])}`).join("")
    : c.posts.map((t, k) => `<div class="bubble"><button class="copy" data-k="${k}">${L("Copy", "Copier")}</button><div class="wa">${wa(t)}</div><span class="time">${now}</span></div>`).join("");
  $("msgs-in").innerHTML = `<div class="msgs-bar">${chips(c.id)}<div class="msgs-state">${state}</div></div>
    <div class="chat-head"><div class="avatar">${emoji(c)}</div><div><b>${esc(c.name)}</b><small>${L("Full message, as members will see it", "Message complet, tel que les membres le verront")}</small></div></div>
    ${c.parts?.some((p) => p.blocks.length) ? `<p class="tip">${L("Click any line to edit it. *bold* and _italic_ work as in WhatsApp; ⌘B too.", "Clique sur une ligne pour la modifier. *gras* et _italique_ marchent comme dans WhatsApp ; ⌘B aussi.")}</p>` : ""}
    ${bubbles || `<p class="empty">${L("Nothing to post in this group.", "Rien à poster dans ce groupe.")}</p>`}`;
  if (data.translating) { clearTimeout(renderMsgs.h); renderMsgs.h = setTimeout(async () => { if (view === "msgs" && !document.activeElement.isContentEditable) { await load(); renderMsgs(); } }, 8000); }
}

// Saving an edit: the block is stored with the line's decision, the post is recomposed with it.
$("msgs-in").addEventListener("focusout", async (ev) => {
  const el = ev.target.closest("[contenteditable][data-i]"); if (!el) return;
  const c = data.channels.find((x) => x.id === channel), i = Number(el.dataset.i);
  const x = ["to_book", "week"].flatMap((p) => c.lists[p]).find((y) => y.i === i);
  const before = c.parts.flatMap((p) => p.blocks).find((b) => b.i === i)?.text, text = toWa(el);
  if (!x || text === before) return;
  await decide(x, x.status, text || null);
  toast(L("Saved", "Enregistré")); await load(); renderMsgs();
});
$("msgs-in").addEventListener("click", async (ev) => {
  const ch = ev.target.closest("[data-c]"); if (ch) { channel = ch.dataset.c; return renderMsgs(); }
  const cp = ev.target.closest(".copy");
  const c = data.channels.find((x) => x.id === channel);
  if (cp) { navigator.clipboard.writeText(c.posts[cp.dataset.k]); return toast(L("Post copied", "Message copié")); }
  const act = ev.target.closest("[data-act]"); if (!act) return;
  if (act.dataset.act === "review") return setView("review");
  if (act.dataset.act === "restore") {
    const x = ["to_book", "week"].flatMap((p) => c.lists[p]).find((y) => y.i === Number(act.dataset.i));
    x.block = null; await decide(x, x.status, null); await load(); return renderMsgs();
  }
  if (act.dataset.act === "publish") {
    act.disabled = true; act.textContent = L("Sending…", "Envoi…");
    const r = await (await post2("/api/publish", { channel })).json();
    toast(r.failed?.length ? `${L("Failed", "Échec")} : ${r.failed[0]}` : L("Sent to WhatsApp", "Envoyé sur WhatsApp"));
    await load(); renderMsgs();
  }
});
// Enter inside an edited line makes a line break, never a new paragraph block.
document.addEventListener("keydown", (ev) => {
  if (ev.target.isContentEditable && ev.key === "Enter") { ev.preventDefault(); document.execCommand("insertLineBreak"); }
}, true);

// ---------- Views, language, keyboard ----------
async function setView(v) {
  view = v;
  document.querySelectorAll("#views button").forEach((b) => b.classList.toggle("on", b.dataset.v === v));
  $("review").hidden = v !== "review"; $("msgs").hidden = v !== "msgs";
  await load();
  if (v === "review") { buildQueue(); rv.done = []; rv.inter = null; renderReview(); } else renderMsgs();
  window.scrollTo(0, 0);
}
function paintChrome() {
  document.documentElement.lang = lang;
  const [r, m] = document.querySelectorAll("#views button");
  r.innerHTML = `${L("Review", "Revue")} <kbd>1</kbd>`; m.innerHTML = `${L("Messages", "Messages")} <kbd>2</kbd>`;
  document.querySelectorAll("#lang button").forEach((b) => b.classList.toggle("on", b.dataset.l === lang));
  if (data?.day || paintChrome.day) $("day").textContent = new Date(paintChrome.day + "T12:00").toLocaleDateString(loc(), { weekday: "long", day: "numeric", month: "long" });
}
$("views").addEventListener("click", (ev) => { const b = ev.target.closest("button"); if (b) setView(b.dataset.v); });
$("lang").addEventListener("click", (ev) => {
  const b = ev.target.closest("button"); if (!b) return;
  lang = b.dataset.l; try { localStorage.setItem("grnbl-lang", lang); } catch {}
  paintChrome();
  if (data) view === "review" ? renderReview() : renderMsgs();
});
document.addEventListener("keydown", (ev) => {
  if (ev.target.isContentEditable) { if (ev.key === "Escape") ev.target.blur(); return; }
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (ev.key === "1") return setView("review");
  if (ev.key === "2") return setView("msgs");
  if (view !== "review") return;
  const q = rv.inter || rv.queue[0];
  if (ev.key === "ArrowRight") { ev.preventDefault(); if (q?.kind === "group" || q?.kind === "intro") advance(); else act("keep"); }
  else if (ev.key === "ArrowLeft") { ev.preventDefault(); act("drop"); }
  else if (ev.key === "ArrowDown") { ev.preventDefault(); act("later"); }
  else if (ev.key.toLowerCase() === "z" || ev.key === "Backspace") { ev.preventDefault(); undo(); }
});

// No edition yet: say why, and reload by itself once it is ready.
function waitForRun(d) {
  const say = {
    preparing: L(`The edition has been preparing since ${d.since}. It takes 10 to 15 minutes; this page reloads by itself.`, `L'édition se prépare depuis ${d.since}. Ça prend 10 à 15 minutes ; la page se recharge toute seule.`),
    failed: L(`Preparing the edition failed. Log: ${d.log}. Automatic retry at 2 pm.`, `La préparation a échoué. Journal : ${d.log}. Nouvel essai automatique à 14 h.`),
    none: L("Nothing prepared yet: preparation starts at 10 am, and the Discord message arrives when it is ready.", "Rien de prêt : la préparation démarre à 10 h, le message Discord arrive quand c'est prêt."),
  }[d.state];
  $("rv-main").innerHTML = `<p class="empty">${esc(say)}</p>`; $("rv-detail").innerHTML = "";
  setTimeout(async () => { const again = await (await fetch("/api/events")).json(); if (again.state === "ready") location.reload(); else waitForRun(again); }, 60_000);
}

paintChrome();
fetch("/api/events").then((r) => r.json()).then((d) => {
  events = d.events; paintChrome.day = d.day; paintChrome();
  if (d.state !== "ready") return waitForRun(d);
  setView("review");
});
</script>
</body>
</html>
