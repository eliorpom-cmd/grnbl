<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>grnbl · rédaction</title>
<style>
  :root {
    --bg: #fbfbfd; --panel: #ffffff; --hover: #f2f2f5; --sel: #e8f0fe;
    --ink: #1d1d1f; --body: #515154; --mute: #86868b; --line: rgba(0, 0, 0, .08);
    --accent: #0071e3; --keep: #1a7f37; --drop: #c4314b; --warn: #b25e09;
    --wa-bg: #efeae2; --wa-bubble: #ffffff; --wa-ink: #111b21; --wa-meta: #667781;
    --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 8px 24px rgba(0, 0, 0, .06);
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0b0d; --panel: #141416; --hover: #1c1c1f; --sel: #10243f;
      --ink: #f5f5f7; --body: #b4b4b9; --mute: #7c7c82; --line: rgba(255, 255, 255, .08);
      --accent: #3b93ff; --keep: #3fb950; --drop: #ff6b81; --warn: #f0a04b;
      --wa-bg: #0b141a; --wa-bubble: #202c33; --wa-ink: #e9edef; --wa-meta: #8696a0;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }
  kbd { font: 11px/1 -apple-system, sans-serif; color: var(--mute); border: 1px solid var(--line); border-radius: 4px; padding: 2px 5px; background: var(--panel); }

  /* Top bar */
  .top { height: 52px; flex: none; display: flex; align-items: center; gap: 16px; padding: 0 16px; border-bottom: 1px solid var(--line); }
  .brand { font-weight: 650; letter-spacing: -.02em; font-size: 16px; }
  .day { color: var(--mute); }
  .seg { display: flex; background: var(--hover); border-radius: 8px; padding: 2px; margin-left: 8px; }
  .seg button { border: 0; background: none; padding: 4px 14px; border-radius: 6px; color: var(--body); transition: background .18s var(--ease), color .18s var(--ease); }
  .seg button.on { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .search { margin-left: auto; width: 240px; height: 30px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 0 10px; outline: none; transition: border-color .18s var(--ease); }
  .search:focus { border-color: var(--accent); }

  /* Triage: queues | list | inspector */
  .triage { flex: 1; min-height: 0; display: grid; grid-template-columns: 216px minmax(320px, 1fr) minmax(380px, 460px); }
  .queues { border-right: 1px solid var(--line); padding: 12px 8px; overflow: auto; }
  .group { color: var(--mute); font-size: 12px; font-weight: 600; padding: 14px 10px 4px; }
  .q { width: 100%; display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 6px 10px; border-radius: 7px; text-align: left; color: var(--body); transition: background .15s var(--ease); }
  .q:hover { background: var(--hover); }
  .q.on { background: var(--hover); color: var(--ink); font-weight: 600; }
  .q .n { margin-left: auto; color: var(--mute); font-variant-numeric: tabular-nums; font-weight: 400; }
  .q .ic { width: 8px; height: 8px; border-radius: 50%; flex: none; margin: 0 4px; background: var(--mute); opacity: .5; }
  .q .ic.keep { background: var(--keep); opacity: 1; } .q .ic.drop { background: var(--drop); opacity: 1; }
  .q .ic.warn { background: var(--warn); opacity: 1; } .q .ic.accent { background: var(--accent); opacity: 1; }

  .list { overflow: auto; border-right: 1px solid var(--line); }
  .list-head { position: sticky; top: 0; z-index: 1; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); padding: 12px 16px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 8px; }
  .list-head h2 { margin: 0; font-size: 15px; font-weight: 650; }
  .list-head span { color: var(--mute); }
  .row { display: grid; grid-template-columns: 8px 1fr auto; gap: 10px; align-items: start; padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .15s var(--ease); }
  .row:hover { background: var(--hover); }
  .row.sel { background: var(--sel); }
  .row .st { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; background: var(--line); }
  .row .st.keep { background: var(--keep); } .row .st.drop { background: var(--drop); }
  .row .t { font-weight: 550; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .m { color: var(--mute); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .side { text-align: right; font-size: 12px; color: var(--mute); white-space: nowrap; }
  .score { letter-spacing: 1.5px; color: var(--accent); font-size: 10px; }
  .badges { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
  .b { font-size: 11px; line-height: 18px; padding: 0 7px; border-radius: 99px; background: var(--hover); color: var(--body); white-space: nowrap; }
  .b.pick { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
  .b.book { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
  .b.free { background: color-mix(in srgb, var(--keep) 14%, transparent); color: var(--keep); }
  .empty { color: var(--mute); text-align: center; padding: 64px 24px; }

  /* Inspector */
  .insp { overflow: auto; padding: 24px 24px 32px; }
  .insp h1 { margin: 0 0 4px; font-size: 22px; line-height: 1.2; letter-spacing: -.02em; font-weight: 650; }
  .insp .sub { color: var(--body); margin-bottom: 18px; }
  .facts { display: grid; grid-template-columns: 96px 1fr; gap: 6px 12px; margin: 0 0 20px; }
  .facts dt { color: var(--mute); }
  .facts dd { margin: 0; color: var(--ink); overflow-wrap: anywhere; }
  .note { border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; background: var(--hover); color: var(--body); }
  .note b { color: var(--ink); font-weight: 600; }
  .note.pick { background: color-mix(in srgb, var(--accent) 9%, transparent); }
  .note.dropped { background: color-mix(in srgb, var(--drop) 9%, transparent); }
  .label { font-size: 12px; font-weight: 600; color: var(--mute); margin: 20px 0 6px; display: flex; justify-content: space-between; }
  textarea { width: 100%; min-height: 76px; resize: vertical; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 10px 12px; outline: none; line-height: 1.45; transition: border-color .18s var(--ease); }
  textarea:focus { border-color: var(--accent); }
  .actions { display: flex; gap: 8px; margin-top: 14px; align-items: center; }
  .btn { height: 36px; border-radius: 99px; padding: 0 16px; border: 1px solid var(--line); background: var(--panel); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; transition: transform .15s var(--ease), background .15s var(--ease); }
  .btn:active { transform: scale(.97); }
  .btn.keep { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn.keep.on { background: var(--keep); border-color: var(--keep); color: #fff; }
  .btn.drop.on { background: var(--drop); border-color: var(--drop); color: #fff; }
  .btn kbd { border-color: currentColor; color: inherit; opacity: .6; background: none; }
  .undo { margin-left: auto; color: var(--mute); font-size: 13px; background: none; border: 0; }
  .hint { color: var(--mute); font-size: 12px; margin-top: 24px; display: flex; gap: 14px; flex-wrap: wrap; }

  /* Posts: editor's notes | WhatsApp preview */
  .posts { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(320px, 1fr) minmax(380px, 520px); }
  .notes { overflow: auto; padding: 24px; border-right: 1px solid var(--line); }
  .chans { display: inline-flex; margin: 0 0 24px; }
  .notes h2 { font-size: 15px; font-weight: 650; margin: 0 0 4px; }
  .notes .lead { color: var(--body); margin: 0 0 16px; }
  .pick-row { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .pick-row:hover .pt { color: var(--accent); }
  .pick-row .num { color: var(--mute); font-variant-numeric: tabular-nums; }
  .pick-row .pt { font-weight: 550; transition: color .15s var(--ease); }
  .pick-row .pw { color: var(--body); font-size: 13px; }
  .notes section + section { margin-top: 32px; }
  .phone { overflow: auto; background: var(--wa-bg); padding: 20px 18px 40px; }
  .chan { display: flex; align-items: center; gap: 10px; margin: -20px -18px 16px; padding: 12px 18px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: -20px; z-index: 1; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--hover); display: grid; place-items: center; font-size: 18px; }
  .chan small { display: block; color: var(--mute); }
  .bubble { position: relative; background: var(--wa-bubble); color: var(--wa-ink); border-radius: 8px; padding: 8px 10px 20px; margin: 0 0 14px; max-width: 100%; box-shadow: 0 1px .5px rgba(11, 20, 26, .13); white-space: pre-wrap; overflow-wrap: anywhere; font: 14.2px/1.42 -apple-system, "Helvetica Neue", sans-serif; }
  .bubble .time { position: absolute; right: 10px; bottom: 4px; font-size: 11px; color: var(--wa-meta); }
  .bubble .copy { position: absolute; right: 6px; top: 6px; border: 0; border-radius: 6px; background: var(--hover); color: var(--body); font-size: 12px; padding: 2px 8px; opacity: 0; transition: opacity .15s var(--ease); }
  .bubble:hover .copy { opacity: 1; }
  .bubble a { color: #027eb5; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 12px); opacity: 0; background: var(--ink); color: var(--bg); border-radius: 99px; padding: 8px 16px; font-weight: 500; transition: opacity .2s var(--ease), transform .2s var(--ease); pointer-events: none; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 1100px) { .triage { grid-template-columns: 180px 1fr 380px; } }
  @media (max-width: 820px) {
    .triage { grid-template-columns: 1fr; } .queues { display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px; gap: 4px; }
    .group { display: none; } .q { width: auto; white-space: nowrap; } .insp { border-top: 1px solid var(--line); }
    .posts { grid-template-columns: 1fr; } .search { width: 120px; } .day, .seg kbd { display: none; } .top { gap: 8px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <span class="brand">grnbl</span>
  <span class="day" id="day"></span>
  <div class="seg" id="views">
    <button data-v="triage" class="on">Tri <kbd>1</kbd></button>
    <button data-v="posts">Posts <kbd>2</kbd></button>
  </div>
  <input class="search" id="search" placeholder="Rechercher  /" autocomplete="off">
</header>

<div class="triage" id="triage">
  <nav class="queues" id="queues"></nav>
  <div class="list" id="list"></div>
  <aside class="insp" id="insp"></aside>
</div>

<div class="posts" id="posts" hidden>
  <div class="notes" id="notes"></div>
  <div class="phone" id="phone"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const QUEUES = [
  ["Rédaction", [
    ["todo", "À valider", "dot"],
    ["kept", "Gardés", "keep"],
    ["dropped", "Écartés", "drop"],
    ["dupes", "Doublons", "dot"],
  ]],
  ["Moment", [
    ["book", "À réserver", "warn"],
    ["week", "Cette semaine", "accent"],
    ["late", "Hors délai", "dot"],
  ]],
  ["Filtres", [
    ["free", "Gratuit", "keep"],
    ["family", "Famille", "dot"],
    ["rare", "Rare", "dot"],
  ]],
];
const TIMING = { book_now: "à réserver", opens_soon: "résa bientôt", this_week: "cette semaine", too_late: "trop tard", sold_out: "complet", later: "plus tard" };
let events = [], view = "triage", queue = "todo", selected = null, query = "", channel = "gratuit", postsData = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const toast = (t) => { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove("on"), 1600); };

function status(e) {
  if (e.decision?.status) return e.decision.status;
  if (e.review?.duplicate_of != null) return "dupe";
  return e.review?.keep ? "ai-keep" : "ai-drop";
}
function inQueue(e, q) {
  const s = status(e), t = e.timing;
  switch (q) {
    case "todo": return s === "ai-keep";
    case "kept": return s === "keep";
    case "dropped": return s === "drop" || (s === "ai-drop" && !e.review?.auto);
    case "dupes": return s === "dupe";
    case "book": return (t === "book_now" || t === "opens_soon") && s !== "drop" && s !== "ai-drop";
    case "week": return t === "this_week" && s !== "drop" && s !== "ai-drop";
    case "late": return t === "too_late" || t === "later" || t === "sold_out";
    case "free": return (e.review?.free ?? e.free) === true && s !== "ai-drop" && s !== "drop";
    case "family": return (e.review?.family ?? e.family) && s !== "ai-drop" && s !== "drop";
    case "rare": return e.review?.rare && s !== "ai-drop" && s !== "drop";
  }
  return false;
}
function matches(e) {
  if (!query) return true;
  const hay = `${e.title} ${e.venue || ""} ${e.town || ""} ${e.source_name || ""}`.toLowerCase();
  return hay.includes(query);
}
function rows() {
  return events.filter((e) => inQueue(e, queue) && matches(e)).sort((a, b) =>
    (a.pick ? 0 : 1) - (b.pick ? 0 : 1) || (a.pick?.rank ?? 0) - (b.pick?.rank ?? 0) ||
    (b.review?.score ?? 0) - (a.review?.score ?? 0) || String(a.start).localeCompare(String(b.start)));
}
function when(raw, short) {
  if (!raw) return "";
  const s = String(raw), d = new Date(s.length > 10 ? s : s + "T00:00");
  const day = d.toLocaleDateString("fr-FR", short ? { weekday: "short", day: "numeric", month: "short" } : { weekday: "long", day: "numeric", month: "long" });
  return s.length > 10 ? `${day} · ${d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}` : day;
}
function span(e, short) {
  return e.end && String(e.end).slice(0, 10) !== String(e.start).slice(0, 10) ? `${when(e.start, true)} → ${when(e.end, true)}` : when(e.start, short);
}
const place = (e) => { const p = e.venue || e.town || ""; return p === p.toUpperCase() && p.length > 6 ? p.toLowerCase().replace(/(^|[\s-])\S/g, (c) => c.toUpperCase()) : p; };
const free = (e) => (e.review?.free ?? e.free) === true;

function renderQueues() {
  $("queues").innerHTML = QUEUES.map(([g, qs]) => `<div class="group">${g}</div>` + qs.map(([k, label, ic]) => {
    const n = events.filter((e) => inQueue(e, k) && matches(e)).length;
    return `<button class="q ${k === queue ? "on" : ""}" data-q="${k}"><span class="ic ${ic}"></span>${label}<span class="n">${n}</span></button>`;
  }).join("")).join("");
}

function renderList() {
  const rs = rows();
  if (!rs.some((e) => e.i === selected)) selected = rs[0]?.i ?? null;
  const name = QUEUES.flatMap((g) => g[1]).find((q) => q[0] === queue)[1];
  $("list").innerHTML = `<div class="list-head"><h2>${name}</h2><span>${rs.length}</span></div>` + (rs.map((e) => {
    const s = status(e), r = e.review || {};
    const dot = s === "keep" ? "keep" : s === "drop" ? "drop" : "";
    const badges = [
      e.pick ? `<span class="b pick">Sélection</span>` : "",
      e.timing === "book_now" || e.timing === "opens_soon" ? `<span class="b book">${TIMING[e.timing]}</span>` : "",
      free(e) ? `<span class="b free">gratuit</span>` : "",
      r.rare ? `<span class="b">rare</span>` : "",
      (r.family ?? e.family) ? `<span class="b">famille</span>` : "",
    ].join("");
    return `<div class="row ${e.i === selected ? "sel" : ""}" data-i="${e.i}">
      <span class="st ${dot}"></span>
      <div style="min-width:0"><div class="t">${esc(e.title)}</div><div class="m">${esc(span(e, true))}${place(e) ? " · " + esc(place(e)) : ""}</div>${badges ? `<div class="badges">${badges}</div>` : ""}</div>
      <div class="side"><div class="score">${"●".repeat(r.score || 0)}${"○".repeat(r.score ? 5 - r.score : 0)}</div>${esc(e.source_name || "")}${e.also ? ` +${e.also.length}` : ""}</div>
    </div>`;
  }).join("") || `<p class="empty">Rien ici. Change de file ou efface la recherche.</p>`);
}

function renderInspector() {
  const e = events.find((x) => x.i === selected);
  if (!e) { $("insp").innerHTML = `<p class="empty">Sélectionne un événement.</p>`; return; }
  const r = e.review || {}, s = status(e), d = e.decision;
  const booking = e.booking === "required" ? "Obligatoire" : e.booking === "recommended" ? "Conseillée" : e.booking === "none" ? "Non" : "Inconnue";
  const facts = [
    ["Quand", span(e)],
    ["Où", [e.venue, e.town].filter(Boolean).join(", ")],
    ["Prix", e.price || (free(e) ? "Gratuit" : "")],
    ["Réservation", booking + (e.booking_opens ? ` · ouvre ${when(e.booking_opens)}` : "") + (e.booking_deadline ? ` · avant ${when(e.booking_deadline)}` : "")],
    ["Moment", TIMING[e.timing] || ""],
    ["Source", `${esc(e.source_name || "")}${e.also ? ` et ${e.also.length} autre${e.also.length > 1 ? "s" : ""}` : ""}`],
  ].filter(([, v]) => v);
  const link = e.booking_url || e.url;
  const line = d?.line || e.pick?.line || r.line || "";
  $("insp").innerHTML = `
    <h1>${esc(e.title)}</h1>
    <div class="sub">${esc(e.description || "")}</div>
    <dl class="facts">${facts.map(([k, v]) => `<dt>${k}</dt><dd>${k === "Source" ? v : esc(v)}</dd>`).join("")}
      ${link ? `<dt>Lien</dt><dd><a href="${esc(link)}" target="_blank" rel="noopener">${esc(new URL(link).hostname.replace("www.", ""))} ↗</a></dd>` : ""}</dl>
    ${e.pick ? `<div class="note pick"><b>Rédacteur en chef :</b> ${esc(e.pick.why)}${e.pick.zoom ? `<br><b>Temps fort :</b> ${esc(e.pick.zoom.what)}, ${esc(when(e.pick.zoom.when))}` : ""}</div>` : ""}
    ${r.keep === false && r.why ? `<div class="note dropped"><b>${r.auto ? "Règle" : "IA"} :</b> ${esc(r.why)}</div>` : ""}
    ${s === "dupe" ? `<div class="note">Doublon de « ${esc(events.find((x) => x.i === r.duplicate_of)?.title || "#" + r.duplicate_of)} »</div>` : ""}
    <div class="label"><span>Ligne du post</span><span><kbd>E</kbd> modifier</span></div>
    <textarea id="line">${esc(line)}</textarea>
    <div class="actions">
      <button class="btn keep ${s === "keep" ? "on" : ""}" data-a="keep">Garder <kbd>G</kbd></button>
      <button class="btn drop ${s === "drop" ? "on" : ""}" data-a="drop">Écarter <kbd>X</kbd></button>
      ${d ? `<button class="undo" data-a="undo">Annuler ma décision <kbd>U</kbd></button>` : ""}
    </div>
    <div class="hint"><span><kbd>J</kbd> <kbd>K</kbd> naviguer</span><span><kbd>G</kbd> garder</span><span><kbd>X</kbd> écarter</span><span><kbd>/</kbd> chercher</span><span><kbd>2</kbd> voir les posts</span></div>`;
}

function render() {
  if (view === "triage") { renderQueues(); renderList(); renderInspector(); }
  else renderPosts();
}

function select(i, scroll) {
  selected = i; renderList(); renderInspector();
  if (scroll) document.querySelector(`.row[data-i="${i}"]`)?.scrollIntoView({ block: "nearest" });
}
function move(step) {
  const rs = rows(), k = rs.findIndex((e) => e.i === selected);
  const next = rs[Math.max(0, Math.min(rs.length - 1, k + step))];
  if (next) select(next.i, true);
}

async function decide(status) {
  const e = events.find((x) => x.i === selected);
  if (!e) return;
  const rs = rows(), k = rs.findIndex((x) => x.i === e.i);
  const decision = status ? { status, line: ($("line")?.value || "").trim() } : null;
  await fetch("/api/decide", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ i: e.i, decision }) });
  e.decision = decision;
  postsData = null;
  toast(status === "keep" ? "Gardé" : status === "drop" ? "Écarté" : "Décision annulée");
  // Move on to the next one still in the queue, like an inbox.
  const after = rows();
  if (status && !after.some((x) => x.i === e.i)) selected = (after[k] || after[k - 1] || {}).i ?? null;
  else if (status) { const n = rs[k + 1]; if (n) selected = n.i; }
  render();
  document.querySelector(`.row[data-i="${selected}"]`)?.scrollIntoView({ block: "nearest" });
}

// WhatsApp formatting: *bold*, _italic_, links.
function wa(text) {
  return esc(text)
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<b>$2</b>")
    .replace(/(^|[\s(])_([^_\n]+)_/g, "$1<i>$2</i>");
}

async function renderPosts() {
  if (!postsData) {
    $("phone").innerHTML = `<p class="empty">Préparation des posts…</p>`;
    postsData = await (await fetch("/api/posts")).json();
  }
  const chans = postsData.channels, c = chans.find((x) => x.id === channel) || chans[0];
  const block = (title, lead, items) => items.length ? `<section><h2>${title}</h2><p class="lead">${lead}</p>${items.map((x, k) =>
    `<div class="pick-row" data-i="${x.i}"><span class="num">${k + 1}</span><div><div class="pt">${esc(x.title)}</div><div class="pw">${esc(x.why)}</div></div></div>`).join("")}</section>` : "";
  const watch = postsData.watch || [];
  const tabs = `<div class="seg chans">${chans.map((x) => `<button data-c="${x.id}" class="${x.id === c.id ? "on" : ""}">${esc(x.name.replace("grnbl · ", ""))}</button>`).join("")}</div>`;
  $("notes").innerHTML = tabs +
    block("À réserver maintenant", "Choisis par le rédacteur en chef, dans l'ordre du post. Clique pour ouvrir la fiche.", c.picks.filter((x) => x.post === "to_book")) +
    block("Cette semaine", "Entrée libre, dans les jours qui viennent.", c.picks.filter((x) => x.post === "week")) +
    (c.id === "carburant" ? `<section><h2>Carburant</h2><p class="lead">Calculé chaque matin sur les prix officiels, sans IA ni sélection.</p></section>` : "") +
    (watch.length && c.id !== "carburant" ? `<section><h2>À surveiller</h2><p class="lead">Dates attendues mais pas encore annoncées : rien n'est posté tant que ce n'est pas confirmé.</p>${watch.map((w) =>
      `<div class="pick-row"><span class="num">👀</span><div><div class="pt">${esc(w.name)}</div><div class="pw">${esc(w.why)} ${w.check.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">vérifier ↗</a>`).join(" ")}</div></div></div>`).join("")}</section>` : "");
  const now = new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  $("phone").innerHTML = `<div class="chan"><div class="avatar">${c.id === "gratuit" ? "🆓" : c.id === "carburant" ? "⛽" : "🎭"}</div><div><b>${esc(c.name)}</b><small>Chaîne · aperçu avant publication</small></div></div>` +
    (c.posts.map((t, k) => `<div class="bubble"><button class="copy" data-k="${k}">Copier</button>${wa(t)}<span class="time">${now}</span></div>`).join("") || `<p class="empty">Rien à poster sur cette chaîne aujourd'hui.</p>`);
  $("phone").querySelectorAll(".copy").forEach((b) => b.addEventListener("click", () => { navigator.clipboard.writeText(c.posts[b.dataset.k]); toast("Post copié"); }));
}

function setView(v) {
  view = v;
  $("triage").hidden = v !== "triage"; $("posts").hidden = v !== "posts";
  document.querySelectorAll("#views button").forEach((b) => b.classList.toggle("on", b.dataset.v === v));
  render();
}

$("views").addEventListener("click", (ev) => { const b = ev.target.closest("button"); if (b) setView(b.dataset.v); });
$("queues").addEventListener("click", (ev) => { const b = ev.target.closest(".q"); if (b) { queue = b.dataset.q; selected = null; render(); } });
$("list").addEventListener("click", (ev) => { const r = ev.target.closest(".row"); if (r) select(Number(r.dataset.i)); });
$("insp").addEventListener("click", (ev) => { const b = ev.target.closest("[data-a]"); if (b) decide(b.dataset.a === "undo" ? null : b.dataset.a); });
$("notes").addEventListener("click", (ev) => {
  const ch = ev.target.closest("[data-c]"); if (ch) { channel = ch.dataset.c; renderPosts(); return; }
  const r = ev.target.closest(".pick-row[data-i]"); if (!r || ev.target.closest("a")) return;
  queue = "todo"; const e = events.find((x) => x.i === Number(r.dataset.i));
  if (e && !inQueue(e, "todo")) queue = status(e) === "keep" ? "kept" : "dropped";
  selected = Number(r.dataset.i); setView("triage");
});
$("search").addEventListener("input", (ev) => { query = ev.target.value.trim().toLowerCase(); render(); });

document.addEventListener("keydown", (ev) => {
  const typing = ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName);
  if (ev.key === "Escape") { document.activeElement.blur(); return; }
  if (typing) { if (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) { document.activeElement.blur(); decide("keep"); } return; }
  const k = ev.key.toLowerCase();
  if (k === "1") setView("triage");
  else if (k === "2") setView("posts");
  else if (k === "/") { ev.preventDefault(); $("search").focus(); }
  else if (view !== "triage") return;
  else if (k === "j" || ev.key === "ArrowDown") { ev.preventDefault(); move(1); }
  else if (k === "k" || ev.key === "ArrowUp") { ev.preventDefault(); move(-1); }
  else if (k === "g") decide("keep");
  else if (k === "x") decide("drop");
  else if (k === "u") decide(null);
  else if (k === "e") { ev.preventDefault(); const t = $("line"); t?.focus(); t?.setSelectionRange(t.value.length, t.value.length); }
});

fetch("/api/events").then((r) => r.json()).then((d) => {
  events = d.events;
  $("day").textContent = new Date(d.day + "T12:00").toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
  render();
});
</script>
</body>
</html>
