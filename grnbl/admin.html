<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>grnbl · editor</title>
<style>
  :root {
    --bg: #fbfbfd; --panel: #ffffff; --hover: #f2f2f5; --sel: #e8f0fe;
    --ink: #1d1d1f; --body: #515154; --mute: #86868b; --line: rgba(0, 0, 0, .08);
    --accent: #0071e3; --keep: #1a7f37; --drop: #c4314b; --warn: #b25e09;
    --wa-bg: #efeae2; --wa-bubble: #ffffff; --wa-ink: #111b21; --wa-meta: #667781;
    --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 8px 24px rgba(0, 0, 0, .06);
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0b0d; --panel: #141416; --hover: #1c1c1f; --sel: #10243f;
      --warn: #fbbf24;
      --ink: #f5f5f7; --body: #b4b4b9; --mute: #7c7c82; --line: rgba(255, 255, 255, .08);
      --accent: #3b93ff; --keep: #3fb950; --drop: #ff6b81; --warn: #f0a04b;
      --wa-bg: #0b141a; --wa-bubble: #202c33; --wa-ink: #e9edef; --wa-meta: #8696a0;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }
  kbd { font: 11px/1 -apple-system, sans-serif; color: var(--mute); border: 1px solid var(--line); border-radius: 4px; padding: 2px 5px; background: var(--panel); }

  /* Top bar */
  .top { height: 52px; flex: none; display: flex; align-items: center; gap: 16px; padding: 0 16px; border-bottom: 1px solid var(--line); }
  .brand { font-weight: 650; letter-spacing: -.02em; font-size: 16px; }
  .day { color: var(--mute); }
  .seg { display: flex; background: var(--hover); border-radius: 8px; padding: 2px; margin-left: 8px; }
  .seg button { border: 0; background: none; padding: 4px 14px; border-radius: 6px; color: var(--body); transition: background .18s var(--ease), color .18s var(--ease); }
  .pcheck { margin-top: 4px; font-size: 13px; color: var(--warn, #b45309); }
  .seg.chans { overflow-x: auto; max-width: 100%; scrollbar-width: none; }
  .seg.chans button { white-space: nowrap; }
  .seg button.on { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .search { margin-left: auto; width: 240px; height: 30px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 0 10px; outline: none; transition: border-color .18s var(--ease); }
  .search:focus { border-color: var(--accent); }

  /* Triage: queues | list | inspector */
  .triage { flex: 1; min-height: 0; display: grid; grid-template-columns: 216px minmax(320px, 1fr) minmax(380px, 460px); }
  .queues { border-right: 1px solid var(--line); padding: 12px 8px; overflow: auto; }
  .group { color: var(--mute); font-size: 12px; font-weight: 600; padding: 14px 10px 4px; }
  .q { width: 100%; display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 6px 10px; border-radius: 7px; text-align: left; color: var(--body); transition: background .15s var(--ease); }
  .q:hover { background: var(--hover); }
  .q.on { background: var(--hover); color: var(--ink); font-weight: 600; }
  .q .n { margin-left: auto; color: var(--mute); font-variant-numeric: tabular-nums; font-weight: 400; }
  .q .ic { width: 8px; height: 8px; border-radius: 50%; flex: none; margin: 0 4px; background: var(--mute); opacity: .5; }
  .q .ic.keep { background: var(--keep); opacity: 1; } .q .ic.drop { background: var(--drop); opacity: 1; }
  .q .ic.warn { background: var(--warn); opacity: 1; } .q .ic.accent { background: var(--accent); opacity: 1; }

  .list { overflow: auto; border-right: 1px solid var(--line); }
  .list-head { position: sticky; top: 0; z-index: 1; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); padding: 12px 16px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 8px; }
  .list-head h2 { margin: 0; font-size: 15px; font-weight: 650; }
  .list-head span { color: var(--mute); }
  .row { display: grid; grid-template-columns: 8px 1fr auto; gap: 10px; align-items: start; padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .15s var(--ease); }
  .row:hover { background: var(--hover); }
  .row.sel { background: var(--sel); }
  .row .st { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; background: var(--line); }
  .row .st.keep { background: var(--keep); } .row .st.drop { background: var(--drop); }
  .row .t { font-weight: 550; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .m { color: var(--mute); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .side { text-align: right; font-size: 12px; color: var(--mute); white-space: nowrap; }
  .score { letter-spacing: 1.5px; color: var(--accent); font-size: 10px; }
  .badges { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
  .b { font-size: 11px; line-height: 18px; padding: 0 7px; border-radius: 99px; background: var(--hover); color: var(--body); white-space: nowrap; }
  .b.pick { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
  .b.book { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
  .b.free { background: color-mix(in srgb, var(--keep) 14%, transparent); color: var(--keep); }
  .empty { color: var(--mute); text-align: center; padding: 64px 24px; }

  /* Inspector */
  .insp { overflow: auto; padding: 24px 24px 32px; }
  .insp h1 { margin: 0 0 4px; font-size: 22px; line-height: 1.2; letter-spacing: -.02em; font-weight: 650; }
  .insp .sub { color: var(--body); margin-bottom: 18px; }
  .facts { display: grid; grid-template-columns: 96px 1fr; gap: 6px 12px; margin: 0 0 20px; }
  .facts dt { color: var(--mute); }
  .facts dd { margin: 0; color: var(--ink); overflow-wrap: anywhere; }
  .note { border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; background: var(--hover); color: var(--body); }
  .note b { color: var(--ink); font-weight: 600; }
  .note.pick { background: color-mix(in srgb, var(--accent) 9%, transparent); }
  .note.dropped { background: color-mix(in srgb, var(--drop) 9%, transparent); }
  .label { font-size: 12px; font-weight: 600; color: var(--mute); margin: 20px 0 6px; display: flex; justify-content: space-between; }
  textarea { width: 100%; min-height: 76px; resize: vertical; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 10px 12px; outline: none; line-height: 1.45; transition: border-color .18s var(--ease); }
  textarea:focus { border-color: var(--accent); }
  .actions { display: flex; gap: 8px; margin-top: 14px; align-items: center; }
  .btn { height: 36px; border-radius: 99px; padding: 0 16px; border: 1px solid var(--line); background: var(--panel); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; transition: transform .15s var(--ease), background .15s var(--ease); }
  .btn:active { transform: scale(.97); }
  .btn.keep { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn.keep.on { background: var(--keep); border-color: var(--keep); color: #fff; }
  .btn.drop.on { background: var(--drop); border-color: var(--drop); color: #fff; }
  .btn kbd { border-color: currentColor; color: inherit; opacity: .6; background: none; }
  .undo { margin-left: auto; color: var(--mute); font-size: 13px; background: none; border: 0; }
  .hint { color: var(--mute); font-size: 12px; margin-top: 24px; display: flex; gap: 14px; flex-wrap: wrap; }

  /* Posts: editor's notes | WhatsApp preview */
  .posts { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(320px, 1fr) minmax(380px, 520px); }
  .notes { overflow: auto; padding: 24px; border-right: 1px solid var(--line); }
  .chans { display: inline-flex; margin: 0 0 24px; }
  .notes h2 { font-size: 15px; font-weight: 650; margin: 0 0 4px; }
  .notes .lead { color: var(--body); margin: 0 0 16px; }
  .pick-row { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .pick-row:hover .pt { color: var(--accent); }
  .pick-row .num { color: var(--mute); font-variant-numeric: tabular-nums; }
  .pick-row .pt { font-weight: 550; transition: color .15s var(--ease); }
  .pick-row .pw { color: var(--body); font-size: 13px; }
  .notes section + section { margin-top: 28px; }
  .summary { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 16px; border-radius: 12px; background: var(--hover); margin: 0 0 24px; }
  .summary span { color: var(--body); }
  .summary .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .btn.send { background: var(--keep); border-color: var(--keep); color: #fff; }
  .btn:disabled { opacity: .55; cursor: default; }
  .summary .sent { color: var(--keep); font-weight: 600; white-space: nowrap; }
  .prow { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); transition: opacity .18s var(--ease); }
  .prow.off { opacity: .5; } .prow.dropped .pline { text-decoration: line-through; }
  .pt { font-weight: 600; }
  .pline { color: var(--ink); margin-top: 2px; }
  .pw { color: var(--mute); font-size: 12.5px; margin-top: 2px; }
  .pact { display: flex; gap: 6px; align-items: start; }
  .mini { height: 28px; min-width: 28px; padding: 0 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); color: var(--body); font-size: 12.5px; transition: background .15s var(--ease), color .15s var(--ease); }
  @media (hover: hover) { .mini:hover { background: var(--ink); color: var(--bg); } }
  .sec-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; margin: 0 0 4px; }
  .sec-head h2 { margin: 0; white-space: nowrap; }
  .sec-head span { color: var(--mute); white-space: nowrap; }
  .link { margin-left: auto; white-space: nowrap; border: 0; background: none; color: var(--accent); padding: 4px 0; font-size: 13px; }
  .cand { display: grid; grid-template-columns: 22px 1fr auto; gap: 12px; align-items: start; padding: 12px 8px; margin: 0 -8px; border-top: 1px solid var(--line); border-radius: 10px; cursor: pointer; transition: background .15s var(--ease), opacity .15s var(--ease); }
  .cand:not(.on) { opacity: .8; }
  .cand.on { background: color-mix(in srgb, var(--keep) 6%, transparent); }
  @media (hover: hover) { .cand:hover { background: var(--hover); } }
  .cand:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .box { width: 22px; height: 22px; margin-top: 1px; border-radius: 6px; border: 1.5px solid var(--mute); display: grid; place-items: center; transition: background .15s var(--ease), border-color .15s var(--ease); }
  .cand.on .box { background: var(--keep); border-color: var(--keep); }
  .cand.on .box::after { content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
  .am { color: var(--mute); font-size: 12.5px; }
  .clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--body); }
  .star { color: var(--warn); margin-right: 6px; }
  .more { width: 100%; margin: 4px 0 0; padding: 12px; border: 1px dashed var(--line); border-radius: 10px; background: none; color: var(--accent); font-weight: 600; }
  .bench { color: var(--mute); font-size: 12px; font-weight: 600; padding: 14px 0 4px; }
  .phone { overflow: auto; background: var(--wa-bg); padding: 20px 18px 40px; }
  .chan { display: flex; align-items: center; gap: 10px; margin: -20px -18px 16px; padding: 12px 18px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: -20px; z-index: 1; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--hover); display: grid; place-items: center; font-size: 18px; }
  .chan small { display: block; color: var(--mute); }
  .bubble { position: relative; background: var(--wa-bubble); color: var(--wa-ink); border-radius: 8px; padding: 8px 10px 20px; margin: 0 0 14px; max-width: 100%; box-shadow: 0 1px .5px rgba(11, 20, 26, .13); white-space: pre-wrap; overflow-wrap: anywhere; font: 14.2px/1.42 -apple-system, "Helvetica Neue", sans-serif; }
  .bubble .time { position: absolute; right: 10px; bottom: 4px; font-size: 11px; color: var(--wa-meta); }
  .bubble .copy { position: absolute; right: 6px; top: 6px; border: 0; border-radius: 6px; background: var(--hover); color: var(--body); font-size: 12px; padding: 2px 8px; opacity: 0; transition: opacity .15s var(--ease); }
  .bubble:hover .copy { opacity: 1; }
  .bubble a { color: #027eb5; }
  /* English translation under a post: for readers of the board, never posted, so quieter than the bubble. */
  .en { margin: -4px 4px 22px; padding: 2px 0 2px 12px; border-left: 2px solid color-mix(in srgb, var(--wa-meta) 50%, transparent); color: var(--wa-meta);
    white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.45 -apple-system, "Helvetica Neue", sans-serif; }
  .en .en-h { display: block; margin-bottom: 4px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; white-space: normal; }
  .en a { color: inherit; }

  .toast { position: fixed; left: 50%; bottom: 104px; z-index: 20; transform: translate(-50%, 12px); opacity: 0; background: var(--ink); color: var(--bg); border-radius: 99px; padding: 8px 16px; font-weight: 500; transition: opacity .2s var(--ease), transform .2s var(--ease); pointer-events: none; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* Guided review: where you are across the groups, then each line exactly as it is sent. */
  .prog { margin: 0 0 20px; }
  .prog-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin: 0 0 10px; }
  .prog-head b { font-size: 15px; }
  .prog-head span { color: var(--mute); }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); color: var(--body); white-space: nowrap; transition: background .15s var(--ease), border-color .15s var(--ease); }
  .chip small { color: var(--mute); font-size: 12px; }
  .chip.on { border-color: var(--ink); color: var(--ink); font-weight: 600; }
  .chip.done { background: color-mix(in srgb, var(--keep) 10%, var(--panel)); }
  .chip.done small { color: var(--keep); font-weight: 600; }
  .chip.auto { opacity: .7; }
  .ghead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; margin: 0 0 4px; }
  .ghead h2 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
  .ghead span { color: var(--mute); }
  .bar { height: 4px; border-radius: 99px; background: var(--hover); margin: 10px 0 20px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--keep); border-radius: inherit; transition: width .25s var(--ease); }
  .item { display: grid; grid-template-columns: 36px 1fr; gap: 12px; padding: 14px 12px; margin: 0 -12px; border-top: 1px solid var(--line); border-radius: 12px; transition: background .15s var(--ease), opacity .15s var(--ease); }
  .item.ok { background: color-mix(in srgb, var(--keep) 6%, transparent); }
  .item.gone { opacity: .55; }
  .item.gone .msg { text-decoration: line-through; }
  .tick { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--mute); background: var(--panel); display: grid; place-items: center; padding: 0; transition: background .15s var(--ease), border-color .15s var(--ease); }
  .tick::after { content: ""; width: 7px; height: 13px; border: solid var(--mute); border-width: 0 2px 2px 0; transform: translateY(-2px) rotate(45deg); }
  @media (hover: hover) { .tick:hover { border-color: var(--keep); } .tick:hover::after { border-color: var(--keep); } }
  .item.ok .tick { background: var(--keep); border-color: var(--keep); }
  .item.ok .tick::after { border-color: #fff; }
  .msg { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); font: 14.5px/1.45 -apple-system, "Helvetica Neue", sans-serif; }
  .msg a { color: var(--accent); }
  .facts1 { margin-top: 8px; color: var(--body); font-size: 13px; }
  .why { margin-top: 2px; color: var(--mute); font-size: 13px; }
  .why b { color: var(--body); font-weight: 600; }
  .iact { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  /* The group's verdict stays in sight while scrolling the lines. */
  .notes > .summary { position: sticky; bottom: 12px; z-index: 2; margin: 24px 0 0; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); }
  /* Review: one card at a time, keep or remove, the next two waiting behind. */
  .review { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; align-items: center; padding: 20px 16px 32px; }
  .rv-head { width: 100%; max-width: 560px; margin: 0 0 18px; }
  .rv-line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; color: var(--mute); font-size: 13px; }
  .rv-line b { color: var(--ink); font-size: 14px; font-weight: 600; }
  .rv-bar { height: 4px; border-radius: 99px; background: var(--hover); margin-top: 10px; overflow: hidden; }
  .rv-bar i { display: block; height: 100%; background: var(--keep); border-radius: inherit; transition: width .6s cubic-bezier(0.16, 1, 0.3, 1); }
  .stack { position: relative; width: 100%; max-width: 560px; display: grid; }
  .stack > * { grid-area: 1 / 1; }
  .rcard { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 22px 24px 24px; box-shadow: var(--shadow);
    transform-origin: 50% 100%; touch-action: pan-y; user-select: none; transition: transform .6s cubic-bezier(0.16, 1, 0.3, 1), opacity .6s cubic-bezier(0.16, 1, 0.3, 1); }
  .rcard.back1 { transform: translateY(14px) scale(.955); opacity: .7; pointer-events: none; }
  .rcard.back2 { transform: translateY(28px) scale(.91); opacity: .35; pointer-events: none; }
  .rcard.back1, .rcard.back2 { position: absolute; inset: 0; padding: 0; }
  .rcard.drag { transition: none; cursor: grabbing; }
  .rcard.out-keep { transform: translateX(120%) rotate(8deg); opacity: 0; transition-duration: .45s; }
  .rcard.out-drop { transform: translateX(-120%) rotate(-8deg); opacity: 0; transition-duration: .45s; }
  .rcard.enter { transform: translateY(14px) scale(.955); opacity: .7; }
  .rc-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--mute); font-size: 13px; margin: 0 0 14px; }
  .rc-top b { color: var(--body); font-weight: 600; }
  .rc-top button { border: 0; background: none; color: var(--accent); font-size: 13px; padding: 4px 0; }
  .rc-title { margin: 0; font-size: 24px; line-height: 1.2; letter-spacing: -.02em; font-weight: 650; text-wrap: balance; }
  .rc-meta { margin: 6px 0 18px; color: var(--body); }
  .rc-cap { font-size: 12px; font-weight: 600; color: var(--mute); margin: 0 0 6px; }
  .rc-msg { background: var(--wa-bg); color: var(--wa-ink); border-radius: 14px; padding: 12px 14px; white-space: pre-wrap; overflow-wrap: anywhere;
    font: 14px/1.45 -apple-system, "Helvetica Neue", sans-serif; max-height: 34vh; overflow: auto; }
  .rc-msg a { color: #027eb5; }
  .rc-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 18px 0 0; }
  .rc-facts div { min-width: 0; }
  .rc-facts dt { font-size: 12px; color: var(--mute); }
  .rc-facts dd { margin: 2px 0 0; color: var(--ink); font-weight: 550; overflow-wrap: anywhere; }
  .rc-why { margin: 18px 0 0; color: var(--body); }
  .rc-why b { display: block; font-size: 12px; color: var(--mute); font-weight: 600; margin-bottom: 2px; }
  .rc-warn { margin: 14px 0 0; padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--warn) 12%, transparent); color: var(--warn); font-weight: 550; }
  .rc-new { display: inline-block; margin: 0 0 10px; font-size: 12px; font-weight: 600; color: var(--accent); }
  .stamp { position: absolute; top: 22px; padding: 4px 12px; border-radius: 10px; border: 2px solid; font-weight: 700; font-size: 15px; opacity: 0; pointer-events: none; background: var(--panel); }
  .stamp.keep { right: 22px; color: var(--keep); transform: rotate(6deg); }
  .stamp.drop { left: 22px; color: var(--drop); transform: rotate(-6deg); }
  .rv-acts { display: flex; align-items: center; justify-content: center; gap: 28px; margin: 28px 0 0; }
  .rv-btn { display: grid; justify-items: center; gap: 6px; border: 0; background: none; color: var(--mute); font-size: 12px; font-weight: 500; }
  .rv-btn span { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; background: var(--panel); border: 1px solid var(--line);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .05), 0 6px 16px rgba(0, 0, 0, .06); transition: transform .15s var(--ease), background .15s var(--ease), color .15s var(--ease); }
  .rv-btn.keep span { color: var(--keep); } .rv-btn.drop span { color: var(--drop); }
  .rv-btn.undo span { width: 44px; height: 44px; font-size: 18px; color: var(--body); }
  .rv-btn:disabled { opacity: .35; cursor: default; }
  @media (hover: hover) { .rv-btn.keep:not(:disabled):hover span { background: var(--keep); color: #fff; } .rv-btn.drop:not(:disabled):hover span { background: var(--drop); color: #fff; } }
  .rv-btn:not(:disabled):active span { transform: scale(.92); }
  .rc-done { text-align: center; padding: 36px 24px 32px; }
  .rc-done .big { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%; display: grid; place-items: center; background: var(--keep); color: #fff; font-size: 30px; }
  .rc-done p { color: var(--body); margin: 6px 0 22px; }
  .rc-done ul { list-style: none; padding: 0; margin: 0 0 24px; text-align: left; }
  .rc-done li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .rc-done li span { color: var(--mute); }
  .rv-keys { margin-top: 18px; color: var(--mute); font-size: 12px; display: flex; gap: 14px; }
 { grid-template-columns: 180px 1fr 380px; } }
  .back, .panes { display: none; }
  .btn { white-space: nowrap; }

  /* Phone: one page that scrolls, the action under the thumb, one thing at a time. */
  @media (max-width: 820px) {
    html, body { height: auto; }
    body { font-size: 15px; }
    kbd, .hint, .day, .undo kbd { display: none; }
    .top { position: sticky; top: 0; z-index: 5; height: auto; min-height: 52px; flex-wrap: wrap; gap: 8px 10px; padding: 8px 16px;
      padding-top: max(8px, env(safe-area-inset-top)); background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(12px); }
    .top .seg { margin-left: auto; }
    .seg button { min-height: 36px; padding: 0 16px; }
    .search { display: none; order: 3; width: 100%; height: 40px; margin: 0; font-size: 16px; }
    body.v-triage .search { display: block; }

    /* Publish */
    .posts { display: block; }
    .notes { overflow: visible; border: 0; padding: 16px 16px 0; }
    .chans { display: flex; width: 100%; margin: 0 0 12px; }
    .chans button, .panes button { flex: 1; }
    .panes { display: flex; width: 100%; margin: 0 0 16px; }
    .posts.pane-preview .notes section, .posts:not(.pane-preview) .phone { display: none; }
    .phone { overflow: visible; min-height: 60vh; padding: 16px 16px 140px; }
    .chan { position: static; margin: -16px -16px 16px; padding: 12px 16px; }
    .bubble .copy { opacity: 1; }
    .summary { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; margin: 0; border-radius: 16px 16px 0 0;
      flex-direction: column; align-items: stretch; gap: 10px; padding: 14px 16px; padding-bottom: max(14px, env(safe-area-inset-bottom));
      background: var(--panel); box-shadow: 0 -1px 0 var(--line), 0 -8px 24px rgba(0, 0, 0, .08); }
    .summary br, .summary > div > span { display: none; }
    .summary .acts { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
    .summary .btn, .summary .sent { height: 48px; justify-content: center; font-size: 16px; }
    .summary .sent { display: flex; align-items: center; }
    .notes { padding-bottom: 170px; }
    .notes > .summary { position: fixed; bottom: 0; border: 0; }
    .cand { padding: 14px 8px; }
    .box { width: 26px; height: 26px; }
    .cand { grid-template-columns: 26px 1fr auto; }
    .mini { height: 40px; min-width: 40px; font-size: 14px; padding: 0 14px; }

    /* Browse: the list, then the event on its own screen */
    .triage { display: block; }
    .queues { position: sticky; top: var(--top, 104px); z-index: 4; display: flex; overflow-x: auto; gap: 6px; border: 0; border-bottom: 1px solid var(--line);
      padding: 8px 16px; background: var(--bg); scrollbar-width: none; }
    .queues::-webkit-scrollbar { display: none; }
    .group { display: none; }

    .row { padding: 14px 16px; }
    .row .t { white-space: normal; }
    .row .side { display: none; }
    .insp { display: none; }
    .triage.detail .insp { display: block; position: fixed; inset: 0; z-index: 10; overflow: auto; background: var(--bg); padding: 0 16px 120px; }
    .back { display: flex; align-items: center; position: sticky; top: 0; z-index: 1; margin: 0 -16px 12px; padding: 10px 16px;
      padding-top: max(10px, env(safe-area-inset-top)); border: 0; width: calc(100% + 32px); background: color-mix(in srgb, var(--bg) 90%, transparent);
      backdrop-filter: blur(12px); color: var(--accent); font-size: 16px; font-weight: 600; text-align: left; }
    .insp h1 { font-size: 24px; }
    .facts { grid-template-columns: 92px 1fr; }
    textarea { font-size: 16px; }
    .actions { position: fixed; left: 0; right: 0; bottom: 0; margin: 0; padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom));
      background: var(--panel); box-shadow: 0 -1px 0 var(--line); display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .actions .btn { height: 48px; justify-content: center; font-size: 16px; }
    .actions .undo { grid-column: 1 / -1; margin: 0; padding: 4px; }
    .review { padding: 12px 16px 24px; }
    .rcard { padding: 18px 18px 20px; }

    .toast { bottom: calc(110px + env(safe-area-inset-bottom)); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<body>
<header class="top">
  <span class="brand">grnbl</span>
  <span class="day" id="day"></span>
  <div class="seg" id="views">
    <button data-v="review" class="on">Review <kbd>1</kbd></button>
    <button data-v="posts">Publish <kbd>2</kbd></button>
    <button data-v="triage">Browse <kbd>3</kbd></button>
  </div>
  <input class="search" id="search" placeholder="Search  /" autocomplete="off">
</header>

<div class="triage" id="triage" hidden>
  <nav class="queues" id="queues"></nav>
  <div class="list" id="list"></div>
  <aside class="insp" id="insp"></aside>
</div>

<div class="review" id="review"></div>

<div class="posts" id="posts" hidden>
  <div class="notes" id="notes"></div>
  <div class="phone" id="phone"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const QUEUES = [
  ["Editorial", [
    ["picks", "Today's picks", "accent"],
    ["todo", "Everything the AI keeps", "dot"],
    ["kept", "Kept", "keep"],
    ["dropped", "Dropped", "drop"],
    ["dupes", "Duplicates", "dot"],
  ]],
  ["Timing", [
    ["book", "To book", "warn"],
    ["week", "This week", "accent"],
    ["late", "Out of window", "dot"],
  ]],
  ["Filters", [
    ["free", "Free", "keep"],
    ["family", "Family", "dot"],
    ["rare", "Rare", "dot"],
  ]],
];
const TIMING = { book_now: "book now", opens_soon: "booking soon", this_week: "this week", too_late: "too late", sold_out: "sold out", later: "later" };
let pane = "lines", from = null;
const phone = () => matchMedia("(max-width: 820px)").matches;
const AVATARS = { gratuit: "🆓", sorties: "🎭", famille: "👨‍👩‍👧", bonsplans: "🛍️", nature: "🏔️", infos: "🚨", carburant: "⛽" };
let events = [], view = "review", queue = "picks", selected = null, query = "", channel = "gratuit", postsData = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const toast = (t) => { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove("on"), 1600); };

function status(e) {
  if (e.decision?.status) return e.decision.status;
  if (e.review?.duplicate_of != null) return "dupe";
  return e.review?.keep ? "ai-keep" : "ai-drop";
}
function inQueue(e, q) {
  const s = status(e), t = e.timing;
  switch (q) {
    case "picks": return !!e.pick;
    case "todo": return s === "ai-keep";
    case "kept": return s === "keep";
    case "dropped": return s === "drop" || (s === "ai-drop" && !e.review?.auto);
    case "dupes": return s === "dupe";
    case "book": return (t === "book_now" || t === "opens_soon") && s !== "drop" && s !== "ai-drop";
    case "week": return t === "this_week" && s !== "drop" && s !== "ai-drop";
    case "late": return t === "too_late" || t === "later" || t === "sold_out";
    case "free": return (e.review?.free ?? e.free) === true && s !== "ai-drop" && s !== "drop";
    case "family": return (e.review?.family ?? e.family) && s !== "ai-drop" && s !== "drop";
    case "rare": return e.review?.rare && s !== "ai-drop" && s !== "drop";
  }
  return false;
}
function matches(e) {
  if (!query) return true;
  const hay = `${e.title} ${e.venue || ""} ${e.town || ""} ${e.source_name || ""}`.toLowerCase();
  return hay.includes(query);
}
function rows() {
  return events.filter((e) => inQueue(e, queue) && matches(e)).sort((a, b) =>
    (a.pick ? 0 : 1) - (b.pick ? 0 : 1) || (a.pick?.rank ?? 0) - (b.pick?.rank ?? 0) ||
    (b.review?.score ?? 0) - (a.review?.score ?? 0) || String(a.start).localeCompare(String(b.start)));
}
function when(raw, short) {
  if (!raw) return "";
  const s = String(raw), d = new Date(s.length > 10 ? s : s + "T00:00");
  const day = d.toLocaleDateString("en-GB", short ? { weekday: "short", day: "numeric", month: "short" } : { weekday: "long", day: "numeric", month: "long" });
  return s.length > 10 ? `${day} · ${d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })}` : day;
}
function span(e, short) {
  return e.end && String(e.end).slice(0, 10) !== String(e.start).slice(0, 10) ? `${when(e.start, true)} → ${when(e.end, true)}` : when(e.start, short);
}
const place = (e) => { const p = e.venue || e.town || ""; return p === p.toUpperCase() && p.length > 6 ? p.toLowerCase().replace(/(^|[\s-])\S/g, (c) => c.toUpperCase()) : p; };
const free = (e) => (e.review?.free ?? e.free) === true;

function renderQueues() {
  $("queues").innerHTML = QUEUES.map(([g, qs]) => `<div class="group">${g}</div>` + qs.map(([k, label, ic]) => {
    const n = events.filter((e) => inQueue(e, k) && matches(e)).length;
    return `<button class="q ${k === queue ? "on" : ""}" data-q="${k}"><span class="ic ${ic}"></span>${label}<span class="n">${n}</span></button>`;
  }).join("")).join("");
}

function renderList() {
  const rs = rows();
  if (!rs.some((e) => e.i === selected)) selected = rs[0]?.i ?? null;
  const name = QUEUES.flatMap((g) => g[1]).find((q) => q[0] === queue)[1];
  $("list").innerHTML = `<div class="list-head"><h2>${name}</h2><span>${rs.length}</span></div>` + (rs.map((e) => {
    const s = status(e), r = e.review || {};
    const dot = s === "keep" ? "keep" : s === "drop" ? "drop" : "";
    const badges = [
      e.pick ? `<span class="b pick">Picked</span>` : "",
      e.timing === "book_now" || e.timing === "opens_soon" ? `<span class="b book">${TIMING[e.timing]}</span>` : "",
      free(e) ? `<span class="b free">free</span>` : "",
      r.rare ? `<span class="b">rare</span>` : "",
      (r.family ?? e.family) ? `<span class="b">family</span>` : "",
    ].join("");
    return `<div class="row ${e.i === selected ? "sel" : ""}" data-i="${e.i}">
      <span class="st ${dot}"></span>
      <div style="min-width:0"><div class="t">${esc(e.title)}</div><div class="m">${esc(span(e, true))}${place(e) ? " · " + esc(place(e)) : ""}</div>${badges ? `<div class="badges">${badges}</div>` : ""}</div>
      <div class="side"><div class="score">${"●".repeat(r.score || 0)}${"○".repeat(r.score ? 5 - r.score : 0)}</div>${esc(e.source_name || "")}${e.also ? ` +${e.also.length}` : ""}</div>
    </div>`;
  }).join("") || `<p class="empty">Nothing here. Pick another queue or clear the search.</p>`);
}

function renderInspector() {
  const e = events.find((x) => x.i === selected);
  if (!e) { $("insp").innerHTML = `<button class="back" data-back>‹ List</button><p class="empty">Select an event.</p>`; return; }
  const r = e.review || {}, s = status(e), d = e.decision;
  const booking = e.booking === "required" ? "Required" : e.booking === "recommended" ? "Recommended" : e.booking === "none" ? "No" : "Unknown";
  const facts = [
    ["When", span(e)],
    ["Where", [e.venue, e.town].filter(Boolean).join(", ")],
    ["Price", e.price || (free(e) ? "Free" : "")],
    ["Booking", booking + (e.booking_opens ? ` · opens ${when(e.booking_opens)}` : "") + (e.booking_deadline ? ` · by ${when(e.booking_deadline)}` : "")],
    ["Timing", TIMING[e.timing] || ""],
    ["Source", `${esc(e.source_name || "")}${e.also ? ` and ${e.also.length} other${e.also.length > 1 ? "s" : ""}` : ""}`],
  ].filter(([, v]) => v);
  const link = e.booking_url || e.url;
  const line = d?.line || e.pick?.line || r.line || "";
  $("insp").innerHTML = `
    <button class="back" data-back>‹ ${from === "posts" ? "Publish" : from === "review" ? "Review" : "List"}</button>
    <h1>${esc(e.title)}</h1>
    <div class="sub">${esc(e.description || "")}</div>
    <dl class="facts">${facts.map(([k, v]) => `<dt>${k}</dt><dd>${k === "Source" ? v : esc(v)}</dd>`).join("")}
      ${link ? `<dt>Link</dt><dd><a href="${esc(link)}" target="_blank" rel="noopener">${esc(new URL(link).hostname.replace("www.", ""))} ↗</a></dd>` : ""}</dl>
    ${e.pick ? `<div class="note pick"><b>Editor-in-chief:</b> ${esc(e.pick.why)}${e.pick.zoom ? `<br><b>Highlight:</b> ${esc(e.pick.zoom.what)}, ${esc(when(e.pick.zoom.when))}` : ""}</div>` : ""}
    ${r.keep === false && r.why ? `<div class="note dropped"><b>${r.auto ? "Rule" : "AI"}:</b> ${esc(r.why)}</div>` : ""}
    ${s === "dupe" ? `<div class="note">Duplicate of “${esc(events.find((x) => x.i === r.duplicate_of)?.title || "#" + r.duplicate_of)}”</div>` : ""}
    <div class="label"><span>Post line</span><span><kbd>E</kbd> edit</span></div>
    <textarea id="line">${esc(line)}</textarea>
    <div class="actions">
      <button class="btn keep ${s === "keep" ? "on" : ""}" data-a="keep">Keep <kbd>G</kbd></button>
      <button class="btn drop ${s === "drop" ? "on" : ""}" data-a="drop">Drop <kbd>X</kbd></button>
      ${d ? `<button class="undo" data-a="undo">Undo my decision <kbd>U</kbd></button>` : ""}
    </div>
    <div class="hint"><span><kbd>J</kbd> <kbd>K</kbd> navigate</span><span><kbd>G</kbd> keep</span><span><kbd>X</kbd> drop</span><span><kbd>/</kbd> search</span><span><kbd>1</kbd> review</span></div>`;
}

function render() {
  if (view === "triage") { renderQueues(); renderList(); renderInspector(); }
  else if (view === "review") renderReview();
  else renderPosts();
}

function openDetail(on) {
  $("triage").classList.toggle("detail", on && phone());
  document.body.style.overflow = on && phone() ? "hidden" : "";
  if (on) $("insp").scrollTop = 0;
}
function select(i, scroll) {
  selected = i; renderList(); renderInspector(); openDetail(true);
  if (scroll) document.querySelector(`.row[data-i="${i}"]`)?.scrollIntoView({ block: "nearest" });
}
function move(step) {
  const rs = rows(), k = rs.findIndex((e) => e.i === selected);
  const next = rs[Math.max(0, Math.min(rs.length - 1, k + step))];
  if (next) select(next.i, true);
}

async function save(e, decision) {
  if (view !== "review") rv.data = null;
  await fetch("/api/decide", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ i: e.i, decision }) });
  e.decision = decision;
  postsData = null;
}

async function decide(status) {
  const e = events.find((x) => x.i === selected);
  if (!e) return;
  const rs = rows(), k = rs.findIndex((x) => x.i === e.i);
  const decision = status ? { status, line: ($("line")?.value || "").trim() } : null;
  await save(e, decision);
  toast(status === "keep" ? "Kept" : status === "drop" ? "Dropped" : "Decision undone");
  // Move on to the next one still in the queue, like an inbox.
  const after = rows();
  if (status && !after.some((x) => x.i === e.i)) selected = (after[k] || after[k - 1] || {}).i ?? null;
  else if (status) { const n = rs[k + 1]; if (n) selected = n.i; }
  render();
  document.querySelector(`.row[data-i="${selected}"]`)?.scrollIntoView({ block: "nearest" });
}

// WhatsApp formatting: *bold*, _italic_, links.
function wa(text) {
  return esc(text)
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<b>$2</b>")
    .replace(/(^|[\s(])_([^_\n]+)_/g, "$1<i>$2</i>");
}

// The English translation shown under a post (translate.py): read-only, never sent.
function english(x) {
  const head = (note) => `<span class="en-h">English translation (not posted)${note ? " · " + note : ""}</span>`;
  if (!x) return postsData.translating ? `<div class="en">${head()}Translating…</div>` : "";
  if (!x.text) return `<div class="en">${head()}Translation unavailable.</div>`;
  return `<div class="en">${head(x.stale ? (postsData.translating ? "earlier version, updating…" : "earlier version") : "")}${wa(x.text)}</div>`;
}
// While translations are being made, check again a little later.
function pollTranslations() {
  clearTimeout(pollTranslations.h);
  if (postsData?.translating) pollTranslations.h = setTimeout(() => { if (view === "posts") { postsData = null; renderPosts(); } }, 8000);
}

// One ticked list per post: the editor's lines come ticked, the human ticks or unticks freely.
const ticked = (c) => ["to_book", "week"].flatMap((post) => (c.lists?.[post] || []).filter((x) => x.on));
const opened = new Set();  // posts whose other candidates are shown
// Where a group stands: lines ticked to go, how many are not checked yet, sent or not.
function progress(c) {
  const on = ticked(c), left = on.filter((x) => x.status !== "keep").length, out = Object.values(c.outbox || {});
  return { c, total: on.length, left, done: on.length > 0 && left === 0, sent: out.length > 0 && out.every((r) => r.status === "sent") };
}
const day = (iso) => { const d = new Date(iso); return `${d.toLocaleDateString("en-GB", { weekday: "short" })} ${d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })}`; };

// The WhatsApp step: offered once the post is approved, then shows what the outbox says.
function sendButton(c, ready) {
  const out = Object.values(c.outbox || {}), sent = out.filter((r) => r.status === "sent"), failed = out.find((r) => r.status === "failed");
  if (out.length && sent.length === out.length) return `<span class="sent">Sent at ${esc(sent[0].sent_at.slice(11, 16))} ✓</span>`;
  const at = c.sends_at ? new Date(c.sends_at) : null;
  const when = at ? `${at.toLocaleDateString("en-GB", { weekday: "long" })} at ${at.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })}` : "";
  if (!ready) return when ? `<span class="sent">Goes out ${esc(when)} if approved</span>` : "";
  if (when && new Date(c.sends_at) > new Date()) return `<span class="sent">Approved · goes out ${esc(when)} ✓</span>`;
  if (!c.linked) return `<button class="btn" disabled title="Link the group: node whatsapp/send.mjs groups, then data/whatsapp.json">Group not linked yet</button>`;
  return `<button class="btn send" data-act="publish" ${failed ? `title="${esc(failed.error || "")}"` : ""}>${failed ? "Retry sending" : "Post to WhatsApp"}</button>`;
}

async function renderPosts() {
  if (!postsData) {
    if (!$("phone").innerHTML) $("phone").innerHTML = `<p class="empty">Preparing the posts…</p>`;
    postsData = await (await fetch("/api/posts")).json();
  }
  const chans = postsData.channels, c = chans.find((x) => x.id === channel) || chans[0];
  const shown = ticked(c);
  const okAll = shown.length && shown.every((x) => x.status === "keep");
  const short = (raw) => raw ? new Date(String(raw).length > 10 ? raw : raw + "T00:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }) : "";
  const groups = chans.filter((x) => !["carburant", "infos"].includes(x.id)).map(progress);
  const chips = `<div class="chips">${chans.map((x) => {
    const g = groups.find((y) => y.c === x);
    const state = !g ? `<small>auto</small>` : g.sent ? `<small>sent ✓</small>` : g.done ? `<small>✓</small>` : `<small>${g.left} left</small>`;
    return `<button class="chip ${x.id === c.id ? "on" : ""} ${g?.done ? "done" : ""} ${g ? "" : "auto"}" data-c="${x.id}">${esc(x.label || x.name)} ${state}</button>`;
  }).join("")}</div>`;
  const todo = groups.filter((g) => !g.done), first = groups.map((g) => g.c.sends_at).filter(Boolean).sort()[0];
  const head = `<div class="prog"><div class="prog-head">${todo.length
    ? `<b>${todo.length} of ${groups.length} groups to review</b><span>${todo.reduce((n, g) => n + g.left, 0)} lines left${first ? ` · first send ${esc(day(first))}` : ""}</span>`
    : `<b>Everything is approved ✓</b><span>Each group goes out at its time, nothing else to do.</span>`}</div>${chips}</div>`;

  // A line's facts that the message itself does not say: price, booking, where it comes from.
  const facts = (x) => {
    const book = x.booking === "required" ? "booking required" : x.booking === "recommended" ? "booking advised" : x.booking === "none" ? "no booking" : "";
    const opens = x.booking_opens ? `opens ${short(x.booking_opens)}` : x.booking_deadline ? `book by ${short(x.booking_deadline)}` : "";
    return [x.price, book, opens, x.source && `from ${x.source}`].filter(Boolean).join(" · ");
  };
  const item = (x) => {
    const ok = x.on && x.status === "keep", gone = !x.on;
    const text = x.on ? (x.sent ? wa(x.sent) : `<b>${esc(x.title)}</b>\n<span class="pcheck">Not in the message: “Book now” keeps 8 lines at most.</span>`)
      : `<b>${esc(x.title)}</b> · ${esc([short(x.start), x.place].filter(Boolean).join(" · "))}\n   ${esc(x.line)}`;
    return `<div class="item ${ok ? "ok" : ""} ${gone ? "gone" : ""}" data-i="${x.i}" data-post="${x.post}">
      ${x.on ? `<button class="tick" data-act="${ok ? "unok" : "ok"}" aria-pressed="${ok}" title="${ok ? "Checked: click to undo" : "Checked, this line can go"}"></button>` : `<span></span>`}
      <div><div class="msg">${text}</div>
        ${facts(x) ? `<div class="facts1">${esc(facts(x))}</div>` : ""}
        ${x.why ? `<div class="why"><b>Why:</b> ${esc(x.why)}</div>` : ""}
        ${x.check?.length ? `<div class="pcheck">⚠️ Check on the page: ${esc(x.check.join(", "))}</div>` : ""}
        <div class="iact">${x.on ? `<button class="mini" data-act="drop">✕ Remove</button>` : `<button class="mini" data-act="add">${x.main ? "↩︎ Put back" : "+ Add"}</button>`}
          <button class="mini" data-act="open">Details</button></div></div></div>`;
  };
  const section = (post, title) => {
    const list = c.lists?.[post] || [];
    if (!list.length) return "";
    const top = list.filter((x) => x.main || x.on), off = list.filter((x) => !x.main && !x.on), open = opened.has(c.id + post);
    return `<section><div class="sec-head"><h2>${title}</h2><span>${list.filter((x) => x.on).length} lines</span>
        ${c.custom?.[post] ? `<button class="link" data-act="reset" data-post="${post}">Back to the AI's choice</button>` : ""}</div>
      ${top.map(item).join("")}
      ${off.length ? `<button class="more" data-act="more" data-post="${post}">${open ? "Hide the other options" : `Show ${off.length} other option${off.length > 1 ? "s" : ""}`}</button>${open ? off.map(item).join("") : ""}` : ""}</section>`;
  };
  const watch = postsData.watch || [];
  const g = groups.find((y) => y.c === c), next = g && groups.find((y) => !y.done && y !== g);
  const summary = c.id === "carburant" ? `<div class="summary"><div><b>Sent automatically</b><br><span>Worked out every morning from official prices, nothing to review.</span></div>${sendButton(c, true)}</div>`
    : c.id === "infos" ? `<div class="summary"><div><b>${c.posts.length ? "Alert to approve" : "Nothing serious"}</b><br><span>Red weather warning, very bad air, tram strike: rare, goes to the community announcements.</span></div>${c.posts.length ? sendButton(c, true) : ""}</div>`
    : g.done ? `<div class="summary"><div><b>${esc(c.label)} approved ✓</b><br><span>${next ? `Next: ${esc(next.c.label)}, ${next.left} lines.` : "That was the last group."}</span></div>
       <div class="acts">${sendButton(c, true)}${next ? `<button class="btn keep" data-act="next" data-to="${next.c.id}">Next: ${esc(next.c.label)} →</button>` : ""}</div></div>`
    : `<div class="summary"><div><b>${g.left} of ${g.total} lines to check</b><br><span>Tick each line that can go, or remove it. Nothing goes out until every line is ticked.</span></div>
       <div class="acts"><button class="btn" data-act="all">Tick the ${g.left} left</button></div></div>`;
  const ghead = g ? `<div class="ghead"><h2>${esc(c.label)}</h2><span>${c.sends_at ? `goes out ${esc(day(c.sends_at))}` : ""} · ${g.total - g.left} of ${g.total} checked</span></div>
    <div class="bar"><i style="width:${g.total ? Math.round(100 * (g.total - g.left) / g.total) : 0}%"></i></div>` : "";
  const panes = `<div class="seg panes"><button data-pane="lines" class="${pane === "lines" ? "on" : ""}">Lines</button><button data-pane="preview" class="${pane === "preview" ? "on" : ""}">Full message</button></div>`;
  $("posts").classList.toggle("pane-preview", pane === "preview");
  $("notes").innerHTML = head + panes + ghead + section("to_book", "Book now") + section("week", "This week") +
    (watch.length && g ? `<section><h2>To watch</h2>${watch.map((w) =>
      `<div class="prow"><div class="pmain"><div class="pt">👀 ${esc(w.name)}</div><div class="pw">${esc(w.why)} ${w.check.map((u) => `<a href="${esc(u)}" target="_blank" rel="noopener">check ↗</a>`).join(" ")}</div></div></div>`).join("")}</section>` : "") + summary;
  const now = new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  $("phone").innerHTML = `<div class="chan"><div class="avatar">${AVATARS[c.id] || "🎭"}</div><div><b>${esc(c.name)}</b><small>Full message, as members will see it</small></div></div>` +
    (c.posts.map((t, k) => `<div class="bubble"><button class="copy" data-k="${k}">Copy</button>${wa(t)}<span class="time">${now}</span></div>${english(c.en?.[k])}`).join("") || `<p class="empty">Nothing to post in this group today.</p>`);
  pollTranslations();
  $("phone").querySelectorAll(".copy").forEach((b) => b.addEventListener("click", () => { navigator.clipboard.writeText(c.posts[b.dataset.k]); toast("Post copied"); }));
}

// Review: every line still to check, group by group, one card at a time.
// Keep = the line's decision becomes "keep"; Remove = the line leaves its post (same as unticking),
// and the editor's next unused reserve comes up as a replacement card, so the post keeps its length.
const rv = { data: null, queue: [], at: 0, done: [], busy: false };

async function startReview() {
  rv.data = await (await fetch("/api/posts")).json();
  rv.queue = []; rv.at = 0; rv.done = [];
  for (const c of rv.data.channels) {
    if (["carburant", "infos"].includes(c.id) || !c.lists) continue;
    const todo = ["to_book", "week"].flatMap((post) => (c.lists[post] || []).filter((x) => x.on && x.status !== "keep"));
    if (todo.length) { rv.queue.push(...todo.map((x) => ({ kind: "line", c, x }))); rv.queue.push({ kind: "group", c }); }
  }
  rv.queue.push({ kind: "end" });
}
const rvGroups = () => (rv.data?.channels || []).filter((c) => c.lists && !["carburant", "infos"].includes(c.id));
const rvLeft = () => rv.queue.slice(rv.at).filter((q) => q.kind === "line").length;

function card(q, cls = "") {
  if (q.kind === "group") {
    const g = progress(q.c), next = rv.queue.slice(rv.queue.indexOf(q) + 1).find((y) => y.kind === "line");
    return `<article class="rcard rc-done ${cls}"><div class="big">✓</div><h1 class="rc-title">${esc(q.c.label)} is ready</h1>
      <p>${g.total} line${g.total === 1 ? "" : "s"} · ${q.c.sends_at ? `goes out ${esc(day(q.c.sends_at))}` : "not scheduled"}</p>
      <button class="btn keep" data-rv="next">${next ? `Continue: ${esc(next.c.label)} →` : "Finish →"}</button></article>`;
  }
  if (q.kind === "end") {
    return `<article class="rcard rc-done ${cls}"><div class="big">✓</div><h1 class="rc-title">All checked</h1>
      <p>Every group goes out at its time. Nothing else to do this week.</p>
      <ul>${rvGroups().map((c) => { const g = progress(c);
        return `<li><b>${esc(c.label)}</b><span>${g.done ? `${g.total} lines · ${c.sends_at ? esc(day(c.sends_at)) : "ready"}` : g.total ? `${g.left} left` : "nothing to post"}</span></li>`; }).join("")}</ul>
      <button class="btn" data-rv="publish">See the full messages</button></article>`;
  }
  const { c, x } = q, post = x.post === "to_book" ? "Book now" : "This week";
  const book = x.booking === "required" ? "Required" : x.booking === "recommended" ? "Advised" : x.booking === "none" ? "Not needed" : "Unknown";
  const by = x.booking_opens ? `opens ${when(x.booking_opens, true)}` : x.booking_deadline ? `by ${when(x.booking_deadline, true)}` : "";
  const msg = x.sent || `${x.title}\n   ${x.line}`;
  return `<article class="rcard ${cls}" data-i="${x.i}">
    <span class="stamp keep">KEEP</span><span class="stamp drop">REMOVE</span>
    <div class="rc-top"><span><b>${esc(c.label)}</b> · ${post}</span><button data-rv="details">Details ↗</button></div>
    ${q.instead ? `<span class="rc-new">Replacement for “${esc(q.instead)}”</span>` : ""}
    <h1 class="rc-title">${esc(x.title)}</h1>
    <div class="rc-meta">${esc([when(x.start, true), x.place].filter(Boolean).join(" · "))}</div>
    <div class="rc-cap">${q.instead ? "Joins the message if kept" : x.sent ? "As sent on WhatsApp" : "Not in the message: “Book now” keeps 8 lines at most"}</div>
    <div class="rc-msg">${wa(msg)}</div>
    <dl class="rc-facts"><div><dt>Price</dt><dd>${esc(x.price || "Not given")}</dd></div>
      <div><dt>Booking</dt><dd>${esc(book)}${by ? `<br><span style="font-weight:400;color:var(--body)">${esc(by)}</span>` : ""}</dd></div>
      <div><dt>Source</dt><dd>${esc(x.source || "–")}</dd></div></dl>
    ${x.why ? `<p class="rc-why"><b>Why the AI picked it</b>${esc(x.why)}</p>` : ""}
    ${x.check?.length ? `<p class="rc-warn">⚠️ Check on the page: ${esc(x.check.join(", "))}</p>` : ""}
  </article>`;
}

async function renderReview() {
  if (!rv.data) { $("review").innerHTML = `<p class="empty">Loading…</p>`; await startReview(); }
  const q = rv.queue[rv.at], total = rv.queue.filter((y) => y.kind === "line").length, left = rvLeft();
  const isLine = q?.kind === "line";
  const behind = rv.queue.slice(rv.at + 1, rv.at + 3);
  $("review").innerHTML = `
    <div class="rv-head"><div class="rv-line"><b>${left ? `${left} line${left === 1 ? "" : "s"} to check` : "Done"}</b>
      <span>${isLine && q.c.sends_at ? `${esc(q.c.label)} goes out ${esc(day(q.c.sends_at))}` : ""}</span></div>
      <div class="rv-bar"><i style="width:${total ? Math.round(100 * (total - left) / total) : 100}%"></i></div></div>
    <div class="stack">${behind.map((_, k) => `<div class="rcard ${k ? "back2" : "back1"}"></div>`).reverse().join("")}${q ? card(q, "front" + (rv.anim ? " enter" : "")) : ""}</div>
    ${isLine ? `<div class="rv-acts">
      <button class="rv-btn drop" data-rv="drop"><span>✕</span>Remove</button>
      <button class="rv-btn undo" data-rv="undo" ${rv.done.length ? "" : "disabled"}><span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></span>Undo</button>
      <button class="rv-btn keep" data-rv="keep"><span>✓</span>Keep</button></div>
      <div class="rv-keys"><span><kbd>←</kbd> remove</span><span><kbd>→</kbd> keep</span><span><kbd>Z</kbd> undo</span></div>`
      : rv.done.length ? `<div class="rv-acts"><button class="rv-btn undo" data-rv="undo"><span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></span>Undo</button></div>` : ""}`;
  const front = $("review").querySelector(".rcard.front");
  // The next card rises from the stack into place.
  if (rv.anim && front) { rv.anim = false; requestAnimationFrame(() => requestAnimationFrame(() => front.classList.remove("enter"))); }
  if (front && isLine) drag(front);
}

// Lines of a post in their list order, as the server wants them.
const onIds = (c, post) => c.lists[post].filter((y) => y.on).map((y) => y.i);

async function act(kind) {
  const q = rv.queue[rv.at];
  if (rv.busy || q?.kind !== "line") return;
  rv.busy = true;
  const { c, x } = q, e = events.find((y) => y.i === x.i), front = $("review").querySelector(".rcard.front");
  front?.classList.remove("drag"); front?.style.removeProperty("transform");
  front?.classList.add(kind === "keep" ? "out-keep" : "out-drop");
  const step = { q, kind, added: null };
  if (kind === "keep") {
    if (!x.on) { x.on = true; await choose(c.id, x.post, onIds(c, x.post)); }  // a replacement joins the post
    x.status = "keep"; await save(e, { status: "keep", line: x.line });
  } else {
    const was = x.on; x.on = false; step.was = was;
    if (was) await choose(c.id, x.post, onIds(c, x.post));
    // The editor's reserves first, then the channel's next best: one replacement card.
    const seen = new Set(rv.queue.filter((y) => y.kind === "line").map((y) => y.x.i));
    const sub = (c.lists[x.post] || []).find((y) => !y.on && !y.main && !seen.has(y.i));
    if (sub) { step.added = { kind: "line", c, x: sub, instead: x.title }; rv.queue.splice(rv.at + 1, 0, step.added); }
  }
  rv.done.push(step);
  await new Promise((r) => setTimeout(r, 260));
  rv.at++; rv.busy = false; postsData = null; rv.anim = true;
  renderReview();
}

async function undo() {
  const step = rv.done.pop();
  if (!step || rv.busy) return;
  const { q, kind } = step, { c, x } = q, e = events.find((y) => y.i === x.i);
  if (step.added) rv.queue.splice(rv.queue.indexOf(step.added), 1);
  rv.at = rv.queue.indexOf(q);
  if (kind === "keep") { x.status = null; await save(e, null); if (q.instead) { x.on = false; await choose(c.id, x.post, onIds(c, x.post)); } }
  else if (step.was) { x.on = true; await choose(c.id, x.post, onIds(c, x.post)); }
  postsData = null; toast("Undone"); renderReview();
}

// Drag the front card: right keeps, left removes, a short drag springs back.
function drag(el) {
  let x0 = null, dx = 0;
  const stamps = { keep: el.querySelector(".stamp.keep"), drop: el.querySelector(".stamp.drop") };
  el.addEventListener("pointerdown", (ev) => { if (ev.target.closest("button, a")) return; x0 = ev.clientX; dx = 0; el.setPointerCapture(ev.pointerId); el.classList.add("drag"); });
  el.addEventListener("pointermove", (ev) => {
    if (x0 === null) return;
    dx = ev.clientX - x0;
    el.style.transform = `translateX(${dx}px) rotate(${dx / 24}deg)`;
    stamps.keep.style.opacity = Math.max(0, Math.min(1, dx / 100)); stamps.drop.style.opacity = Math.max(0, Math.min(1, -dx / 100));
  });
  const end = () => {
    if (x0 === null) return;
    x0 = null;
    if (Math.abs(dx) > 110) return act(dx > 0 ? "keep" : "drop");
    el.classList.remove("drag"); el.style.removeProperty("transform"); stamps.keep.style.opacity = stamps.drop.style.opacity = 0;
  };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
}

function reviewKey(ev) {
  const q = rv.queue[rv.at];
  if (ev.key === "ArrowRight") { ev.preventDefault(); if (q?.kind === "line") act("keep"); else if (q?.kind === "group") { rv.at++; renderReview(); } }
  else if (ev.key === "ArrowLeft") { ev.preventDefault(); act("drop"); }
  else if (ev.key.toLowerCase() === "z" || ev.key === "Backspace") { ev.preventDefault(); undo(); }
}

$("review").addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-rv]"); if (!b) return;
  const k = b.dataset.rv, q = rv.queue[rv.at];
  if (k === "keep" || k === "drop") act(k);
  else if (k === "undo") undo();
  else if (k === "next") { rv.at++; rv.anim = true; renderReview(); }
  else if (k === "publish") setView("posts");
  else if (k === "details") { queue = "picks"; selected = q.x.i; from = "review"; setView("triage"); openDetail(true); }
});

function setView(v) {
  view = v;
  document.body.classList.toggle("v-triage", v === "triage");
  if (v !== "triage") openDetail(false);
  document.documentElement.style.setProperty("--top", document.querySelector(".top").offsetHeight + "px");
  $("triage").hidden = v !== "triage"; $("posts").hidden = v !== "posts"; $("review").hidden = v !== "review";
  document.querySelectorAll("#views button").forEach((b) => b.classList.toggle("on", b.dataset.v === v));
  render();
}

$("views").addEventListener("click", (ev) => { const b = ev.target.closest("button"); if (b) setView(b.dataset.v); });
$("queues").addEventListener("click", (ev) => { const b = ev.target.closest(".q"); if (b) { queue = b.dataset.q; selected = null; render(); } });
$("list").addEventListener("click", (ev) => { const r = ev.target.closest(".row"); if (r) select(Number(r.dataset.i)); });
$("insp").addEventListener("click", (ev) => {
  if (ev.target.closest("[data-back]")) { openDetail(false); if (from) { const v = from; from = null; setView(v); } return; }
  const b = ev.target.closest("[data-a]"); if (b) decide(b.dataset.a === "undo" ? null : b.dataset.a); });
$("notes").addEventListener("click", async (ev) => {
  const ch = ev.target.closest("[data-c]"); if (ch) { channel = ch.dataset.c; renderPosts(); return; }
  const pn = ev.target.closest("[data-pane]"); if (pn) { pane = pn.dataset.pane; renderPosts(); window.scrollTo(0, 0); return; }
  const act = ev.target.closest("[data-act]"); if (!act) return;
  const c = postsData.channels.find((x) => x.id === channel);
  if (act.dataset.act === "publish") {
    act.disabled = true; act.textContent = "Sending…";
    const r = await (await fetch("/api/publish", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ channel }) })).json();
    toast(r.failed?.length ? `Failed: ${r.failed[0]}` : "Sent to WhatsApp");
    postsData = null; return renderPosts();
  }
  if (act.dataset.act === "all") {
    for (const x of ticked(c).filter((p) => p.status !== "keep")) await save(events.find((y) => y.i === x.i), { status: "keep", line: x.line });
    toast("All lines ticked"); return renderPosts();
  }
  const it = act.closest(".item"), ev_ = it && events.find((y) => y.i === Number(it.dataset.i));
  const x = it && c.lists[it.dataset.post].find((y) => y.i === Number(it.dataset.i));
  if (act.dataset.act === "ok") { await save(ev_, { status: "keep", line: x.line }); return renderPosts(); }
  if (act.dataset.act === "unok") { await save(ev_, null); return renderPosts(); }
  if (act.dataset.act === "drop" || act.dataset.act === "add") {
    x.on = act.dataset.act === "add";
    await choose(channel, it.dataset.post, c.lists[it.dataset.post].filter((y) => y.on).map((y) => y.i));
    toast(x.on ? "Line added" : "Line removed"); return renderPosts();
  }
  if (act.dataset.act === "next") { channel = act.dataset.to; window.scrollTo(0, 0); $("notes").scrollTop = 0; return renderPosts(); }
  if (act.dataset.act === "more") { const k = c.id + act.dataset.post; opened.has(k) ? opened.delete(k) : opened.add(k); return renderPosts(); }
  if (act.dataset.act === "reset") { await choose(c.id, act.dataset.post, null); toast("AI's choice restored"); return renderPosts(); }
  if (act.dataset.act === "open") { queue = "picks"; selected = Number(it.dataset.i); from = "posts"; setView("triage"); return openDetail(true); }
});

async function choose(channel, post, ids) {
  if (view !== "review") rv.data = null;
  await fetch("/api/choose", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ channel, post, ids }) });
  postsData = null;
}
$("search").addEventListener("input", (ev) => { query = ev.target.value.trim().toLowerCase(); render(); });

document.addEventListener("keydown", (ev) => {
  const typing = ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName);
  if (ev.key === "Escape") { document.activeElement.blur(); return; }
  if (typing) { if (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) { document.activeElement.blur(); decide("keep"); } return; }
  const k = ev.key.toLowerCase();
  if (k === "1") setView("review");
  else if (k === "2") setView("posts");
  else if (k === "3") setView("triage");
  else if (view === "review") reviewKey(ev);
  else if (k === "/") { ev.preventDefault(); $("search").focus(); }
  else if (view !== "triage") return;
  else if (k === "j" || ev.key === "ArrowDown") { ev.preventDefault(); move(1); }
  else if (k === "k" || ev.key === "ArrowUp") { ev.preventDefault(); move(-1); }
  else if (k === "g") decide("keep");
  else if (k === "x") decide("drop");
  else if (k === "u") decide(null);
  else if (k === "e") { ev.preventDefault(); const t = $("line"); t?.focus(); t?.setSelectionRange(t.value.length, t.value.length); }
});

if (phone()) $("search").placeholder = "Search";
fetch("/api/events").then((r) => r.json()).then((d) => {
  events = d.events;
  $("day").textContent = new Date(d.day + "T12:00").toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
  if (d.state !== "ready") return waitForRun(d);
  render();
});

// No posts yet today: say why, and reload by itself once the morning run is done.
function waitForRun(d) {
  const say = {
    preparing: `The edition has been preparing since ${d.since}. It takes 10 to 15 minutes; this page reloads by itself when it is ready.`,
    failed: `Preparing the edition failed. Log: ${d.log}. Automatic retry at 2 pm.`,
    none: "Nothing prepared yet: preparation starts at 10 am, and the Discord message arrives when it is ready.",
  }[d.state];
  const box = `<p class="empty">${esc(say)}</p>`;
  for (const id of ["list", "insp", "notes", "phone", "review"]) if ($(id)) $(id).innerHTML = box;
  setTimeout(async () => {
    const again = await (await fetch("/api/events")).json();
    if (again.state === "ready") location.reload(); else waitForRun(again);
  }, 60_000);
}
</script>
